name: Build Navigasi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

       - name: Siapkan Android SDK
         run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Siapkan Platform Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan proyek aplikasi
        run: |
          mkdir -p apk-project/www
          cp map-ab-v4.html apk-project/www/index.html
          cd apk-project

          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.velora.navigasi",
            "appName": "Navigasi VELORA",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: Bangun APK
        run: |
          cd apk-project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-velora-debug-apk
          path: apk-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
