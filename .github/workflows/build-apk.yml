name: Build Navigasi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Capacitor project
        run: |
          mkdir -p apk-project/www
          cp map-ab-v4.html apk-project/www/index.html
          cd apk-project
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.velora.navigasi",
            "appName": "Navigasi VELORA",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Build debug APK
        run: |
          cd apk-project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-velora-debug-apk
          path: apk-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
