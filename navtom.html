
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>NAVIGASI PRIBADI (TOMTOM)</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"/>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #f4f3f8;
  color: #202020;
  overflow: hidden;
}

/* ================= HALAMAN 1: PERENCANAAN ================= */

#halamanRencana {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #f4f3f8;
  z-index: 2000;
  display: flex;
  flex-direction: column;
}

.header-rencana {
  background: #7138e8;
  color: white;
  padding: 20px 15px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

.header-rencana h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
}

.header-rencana p {
  margin: 5px 0 0;
  font-size: 12px;
  opacity: .9;
}

.form-container {
  padding: 20px;
  flex: 1;
  overflow-y: auto;
}

.form-group {
  margin-bottom: 20px;
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #7138e8;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  margin-bottom: 10px;
}

.form-group input:focus {
  border-color: #7138e8;
}

.form-group input[readonly] {
  background: #f9f9f9;
  color: #666;
}

.btn-group {
  display: flex;
  gap: 8px;
}

.btn-group button {
  flex: 1;
  padding: 10px;
  border: 0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.btn-wa {
  background: #25D366;
  color: white;
}

.btn-peta {
  background: #7138e8;
  color: white;
}

/* Peta Mini */

#mapRencana {
  width: 100%;
  height: 200px;
  border-radius: 12px;
  margin-top: 10px;
  display: none;
  border: 2px solid #7138e8;
  z-index: 1;
}

.btn-mulai {
  display: block;
  width: calc(100% - 40px);
  margin: 20px;
  padding: 16px;
  background: #7138e8;
  color: white;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(113,56,232,.4);
}

.btn-mulai:disabled {
  background: #aaa;
  box-shadow: none;
}

/* ================= HALAMAN 2: NAVIGASI ================= */

#halamanNavigasi {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 1000;
}

#map {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

#mapRencana .maplibregl-ctrl-attrib {
  font-size: 8px;
}

.maplibregl-ctrl-attrib {
  font-size: 9px;
}

.maplibregl-ctrl-group button {
  width: 30px;
  height: 30px;
}

.tt-marker {
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tt-marker img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.tt-destination {
  width: 48px;
  height: 48px;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.45));
}

/* PANEL ATAS */

.panel-atas {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 1000;
  background: rgba(30,30,46,.95);
  color: white;
  border-radius: 12px;
  padding: 10px 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,.3);
}

.btn-batal {
  background: transparent;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.tujuan-text {
  flex: 1;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-gps {
  font-size: 10px;
  color: #18a84b;
  font-weight: bold;
  display: block;
  margin-top: 2px;
}

/* INSTRUKSI */

.instruksi-box {
  position: fixed;
  top: 70px;
  left: 10px;
  right: 10px;
  z-index: 999;
  background: #1e1e2e;
  color: white;
  border-radius: 12px;
  padding: 12px 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.25);
  display: none;
  align-items: center;
  gap: 15px;
}

.instruksi-icon {
  font-size: 30px;
}

.instruksi-text {
  font-size: 16px;
  font-weight: 800;
}

.instruksi-dist {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}

/* FOTO DRIVER */

.foto-driver {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,.3);
  margin-left: auto;
}

/* SPEEDOMETER */

.speedometer {
  position: fixed;
  bottom: 100px;
  left: 15px;
  z-index: 1000;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(30,30,46,.9);
  color: white;
  border: 3px solid #7138e8;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.speed-val {
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
}

.speed-unit {
  font-size: 9px;
  color: #aaa;
  margin-top: 2px;
}

/* TOMBOL KEMBALI KE GPS */

.btn-recenter {
  position: fixed;
  right: 15px;
  bottom: 100px;
  z-index: 1000;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #18a84b;
  color: white;
  border: 3px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* PANEL BAWAH */

.panel-bawah {
  position: fixed;
  bottom: 15px;
  left: 10px;
  right: 10px;
  z-index: 1000;
  background: white;
  border-radius: 16px;
  padding: 15px;
  box-shadow: 0 -4px 20px rgba(0,0,0,.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.info-box {
  text-align: center;
  flex: 1;
}

.info-label {
  font-size: 10px;

  font-weight: 700;
  text-transform: uppercase;
}

.info-value {

  font-weight: 800;

}

/* TOAST */

.toast {

<!-- ================= HALAMAN 1: RENCANA ================= -->

<div id="halamanRencana">

  <div class="header-rencana">

<!-- ================= LIBRARY MAPLIBRE ================= -->

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

<script>

// ============================================================
// KONFIGURASI TOMTOM
// ISI API KEY TOMTOM MILIK SOREN DI SINI
// ============================================================

const TOMTOM_API_KEY = "duPP6hddpLvDr8U7xEN9Pit3pMKXD3Xm";

const TOMTOM_STYLE_URL =
  "https://api.tomtom.com/map/1/style/22.2.1-9/2/basic_street-light.json?key=" +
  encodeURIComponent(TOMTOM_API_KEY);

function tomtomSiap() {

  return TOMTOM_API_KEY &&
    TOMTOM_API_KEY !== "ISI_API_KEY_TOMTOM_DI_SINI" &&
    TOMTOM_API_KEY.trim().length > 10;

}

// ============================================================
// STATE APLIKASI
// ============================================================

let map = null;
let mapRencana = null;

let posisiSaya = null;
let titikTujuan = null;

let followMode = true;
let modePilihTujuan = false;
let heading = 0;

let markerSaya = null;
let markerTujuan = null;
let markerTujuanRencana = null;

let ruteData = null;
let ruteAsli = [];

let watchId = null;
let lastRuteCalc = 0;
let calcInProgress = false;
let isOffRoute = false;

let lastPosForSpeed = null;
let lastTimeForSpeed = 0;

let wakeLock = null;
let suaraPerempuan = null;

let instruksiTerakhir = "";
let belokan200SudahBerbunyi = false;
let belokan50SudahBerbunyi = false;

// ============================================================
// ID SOURCE DAN LAYER TOMTOM / MAPLIBRE
// ============================================================

const TT_SOURCE_AKURASI = "soren-gps-accuracy";

const TT_SOURCE_RUTE_LEWAT =
  "soren-route-traveled";

const TT_SOURCE_RUTE_SISA =
  "soren-route-remaining";

const TT_SOURCE_RUTE_GLOW =
  "soren-route-glow";

// ============================================================
// PEMBUAT MARKER
// ============================================================

function buatElemenMobil() {

  const el = document.createElement("div");

  el.className = "tt-marker";

  el.innerHTML = `
    <img
      id="mobilSaya"
      src="mobil.png"
      alt="Posisi kendaraan"
    >
  `;

  return el;

}

function buatElemenTujuan() {

  const el = document.createElement("div");

  el.className = "tt-destination";

  el.innerHTML = `

    <svg viewBox="0 0 100 120" width="100%" height="100%">

      <path
        d="M 50 0 C 22.4 0 0 22.4 0 50 C 0 85 50 120 50 120 C 50 120 100 85 100 50 C 100 22.4 77.6 0 50 0 Z"
        fill="#ff8100"
      />

      <circle
        cx="50"
        cy="45"
        r="18"
        fill="#ffffff"
        opacity="0.3"
      />

    </svg>

  `;

  return el;

}

function tambahMarkerTujuanPeta(peta, koordinat) {

  return new maplibregl.Marker({

    element: buatElemenTujuan(),
    anchor: "bottom"

  })
  .setLngLat(koordinat)
  .addTo(peta);

}

// ============================================================
// INISIALISASI PETA TOMTOM
// ============================================================

function initMap() {

  if (!tomtomSiap()) {

    showToast(
      "Isi TOMTOM_API_KEY terlebih dahulu pada bagian konfigurasi."
    );

    return;

  }

  if (!window.maplibregl) {

    showToast(
      "Library peta gagal dimuat. Periksa koneksi internet."
    );

    return;

  }

  // PETA UTAMA

  map = new maplibregl.Map({

    container: "map",

    style: TOMTOM_STYLE_URL,

    center: [106.936, -6.387],

    zoom: 16,

    attributionControl: true,

    pitchWithRotate: false

  });

  map.addControl(

    new maplibregl.NavigationControl({

      showCompass: false,
      visualizePitch: false

    }),

    "top-right"

  );

  map.on("load", function() {

    siapkanLayerPeta(map);

    if (posisiSaya) {
      perbaruiMarkerGPS();
    }

  });

  // DETEKSI PETA DIGESER MANUAL

  map.on("dragstart", function() {

    followMode = false;

    const btn = document.getElementById("btnRecenter");

    if (btn) {
      btn.style.background = "#7138e8";
    }

  });

  // KLIK PETA UNTUK MEMILIH TUJUAN

  map.on("click", function(e) {

    if (!modePilihTujuan) return;

    modePilihTujuan = false;

    document.getElementById("halamanNavigasi").style.display = "none";

    document.getElementById("halamanRencana").style.display = "flex";

    const lat = e.lngLat.lat;
    const lng = e.lngLat.lng;

    setTujuan(lat, lng, "Titik dari Peta");

    document.getElementById("inputTujuan").value =
      lat.toFixed(6) + ", " + lng.toFixed(6);

    setTimeout(function() {

      tampilkanPetaRencana(lat, lng);

    }, 150);

    showToast("Lokasi tujuan dipilih dari peta");

    cekFormRencana();

  });

  // PETA MINI

  mapRencana = new maplibregl.Map({

    container: "mapRencana",

    style: TOMTOM_STYLE_URL,

    center: [106.936, -6.387],

    zoom: 15,

    attributionControl: true,

    interactive: true,

    pitchWithRotate: false

  });

  mapRencana.on("load", function() {

    if (titikTujuan) {
      perbaruiMarkerTujuanRencana();
    }

  });

  mulaiGPS();

}

// ============================================================
// SOURCE DAN LAYER PETA
// ============================================================

function geojsonKosong() {

  return {

    type: "FeatureCollection",

    features: []

  };

}

function siapkanLayerPeta(peta) {

  if (!peta || !peta.isStyleLoaded()) return;

  // LINGKARAN AKURASI GPS

  if (!peta.getSource(TT_SOURCE_AKURASI)) {

    peta.addSource(TT_SOURCE_AKURASI, {

      type: "geojson",

      data: geojsonKosong()

    });

    peta.addLayer({

      id: "soren-gps-accuracy-fill",

      type: "fill",

      source: TT_SOURCE_AKURASI,

      paint: {

        "fill-color": "#7138e8",

        "fill-opacity": 0.10

      }

    });

    peta.addLayer({

      id: "soren-gps-accuracy-line",

      type: "line",

      source: TT_SOURCE_AKURASI,

      paint: {

        "line-color": "#7138e8",

        "line-width": 1,

        "line-opacity": 0.55

      }

    });

  }

  // GARIS YANG SUDAH DILALUI

  if (!peta.getSource(TT_SOURCE_RUTE_LEWAT)) {

    peta.addSource(TT_SOURCE_RUTE_LEWAT, {

      type: "geojson",

      data: geojsonKosong()

    });

    peta.addLayer({

      id: "soren-route-traveled-line",

      type: "line",

      source: TT_SOURCE_RUTE_LEWAT,

      layout: {

        "line-join": "round",

        "line-cap": "round"

      },

      paint: {

        "line-color": "#8b5cf6",

        "line-width": 6,

        "line-opacity": 0.40

      }

    });

  }

  // EFEK GLOW RUTE

  if (!peta.getSource(TT_SOURCE_RUTE_GLOW)) {

    peta.addSource(TT_SOURCE_RUTE_GLOW, {

      type: "geojson",

      data: geojsonKosong()

    });

    peta.addLayer({

      id: "soren-route-glow-line",

      type: "line",

      source: TT_SOURCE_RUTE_GLOW,

      layout: {

        "line-join": "round",

        "line-cap": "round"

      },

      paint: {

        "line-color": "#7c3aed",

        "line-width": 12,

        "line-opacity": 0.80,

        "line-blur": 1.5

      }

    });

  }

  // GARIS INTI RUTE

  if (!peta.getSource(TT_SOURCE_RUTE_SISA)) {

    peta.addSource(TT_SOURCE_RUTE_SISA, {

      type: "geojson",

      data: geojsonKosong()

    });

    peta.addLayer({

      id: "soren-route-remaining-line",

      type: "line",

      source: TT_SOURCE_RUTE_SISA,

      layout: {

        "line-join": "round",

        "line-cap": "round"

      },

      paint: {

        "line-color": "#ffffff",

        "line-width": 3,

        "line-opacity": 1

      }

    });

  }

}

// ============================================================
// UTILITAS GEOJSON
// ============================================================

function featureGaris(koordinat) {

  return {

    type: "Feature",

    properties: {},

    geometry: {

      type: "LineString",

      coordinates: koordinat

    }

  };

}

function featureCollectionSatu(geometry) {

  return {

    type: "FeatureCollection",

    features: [{

      type: "Feature",

      properties: {},

      geometry: geometry

    }]

  };

}

function kosongkanGarisPeta() {

  if (!map || !map.isStyleLoaded()) return;

  [

    TT_SOURCE_RUTE_LEWAT,
    TT_SOURCE_RUTE_GLOW,
    TT_SOURCE_RUTE_SISA

  ].forEach(function(id) {

    const source = map.getSource(id);

    if (source) {
      source.setData(geojsonKosong());
    }

  });

}

// ============================================================
// LINGKARAN AKURASI GPS
// ============================================================

function buatGeoJSONLingkaran(lat, lng, radiusMeter) {

  const koordinat = [];

  const jumlahTitik = 64;

  const radiusBumi = 6378137;

  const latRad = lat * Math.PI / 180;

  const lngRad = lng * Math.PI / 180;

  const sudutJarak = Math.max(1, radiusMeter) / radiusBumi;

  for (let i = 0; i <= jumlahTitik; i++) {

    const sudut = 2 * Math.PI * i / jumlahTitik;

    const lat2 = Math.asin(

      Math.sin(latRad) * Math.cos(sudutJarak) +

      Math.cos(latRad) *
      Math.sin(sudutJarak) *
      Math.cos(sudut)

    );

    const lng2 = lngRad + Math.atan2(

      Math.sin(sudut) *
      Math.sin(sudutJarak) *
      Math.cos(latRad),

      Math.cos(sudutJarak) -
      Math.sin(latRad) *
      Math.sin(lat2)

    );

    koordinat.push([

      lng2 * 180 / Math.PI,

      lat2 * 180 / Math.PI

    ]);

  }

  return {

    type: "Polygon",

    coordinates: [koordinat]

  };

}

function perbaruiAkurasiGPS() {

  if (!map || !map.isStyleLoaded() || !posisiSaya) return;

  const source = map.getSource(TT_SOURCE_AKURASI);

  if (!source) return;

  source.setData(

    featureCollectionSatu(

      buatGeoJSONLingkaran(

        posisiSaya.lat,

function mulaiGPS() {

  if (!navigator.geolocation) {

    showToast("Browser tidak mendukung GPS");

    return;

  }

  watchId = navigator.geolocation.watchPosition(

    onPosition,

    onPositionError,

    {

      enableHighAccuracy: true,

      maximumAge: 1000,

      timeout: 15000

    }

}

function perbaruiMarkerGPS() {

  if (!map || !posisiSaya) return;

  const koordinat = [

    posisiSaya.lng,

    posisiSaya.lat

  ];

  if (!markerSaya) {

    markerSaya = new maplibregl.Marker({

      element: buatElemenMobil(),

      anchor: "center"

    })

    .setLngLat(koordinat)

    .addTo(map);

  } else {

    markerSaya.setLngLat(koordinat);

  }

  perbaruiAkurasiGPS();

}

function onPosition(position) {

  const lat = position.coords.latitude;

  const lng = position.coords.longitude;

  const acc = position.coords.accuracy;

  posisiSaya = {

    lat: lat,

    lng: lng,

    accuracy: acc

  };

  // STATUS GPS

  const statusEl = document.getElementById("gpsStatus");

  statusEl.textContent =
    "GPS AKTIF (Akurasi: " + Math.round(acc) + "m)";

  statusEl.style.color = "#18a84b";

  // INPUT TITIK AWAL

  const inputAwal = document.getElementById("inputAwal");

  if (

    inputAwal &&

    document.getElementById("halamanRencana").style.display !== "none"

  ) {

    inputAwal.value =
      lat.toFixed(6) + ", " + lng.toFixed(6);

    cekFormRencana();

  }

  hitungKecepatan(lat, lng);

  perbaruiMarkerGPS();

  updateHeading(lat, lng);

  // CEK POSISI PADA RUTE

  if (

    titikTujuan &&

    document.getElementById("halamanNavigasi").style.display === "block"

  ) {

    cekPosisiDiRute();

  }

  // FOLLOW GPS

  if (followMode && map) {

    map.easeTo({

      center: [lng, lat],

      duration: 450,

      essential: true

    });

  }

}

function onPositionError(err) {

  console.warn("GPS error:", err);

  const statusEl = document.getElementById("gpsStatus");

  statusEl.textContent = "GPS ERROR / IZIN DITOLAK";

  statusEl.style.color = "#ff3b30";

  showToast(
    "GPS tidak tersedia. Periksa izin lokasi perangkat."
  );

}

// ============================================================
// KECEPATAN & HEADING
// ============================================================

function hitungKecepatan(lat, lng) {

  const now = Date.now();

  if (lastPosForSpeed && lastTimeForSpeed) {

    const jarak = jarakMeter(

      lastPosForSpeed.lat,

      lastPosForSpeed.lng,

      lat,

      lng

    );

    const waktuDetik = (now - lastTimeForSpeed) / 1000;

    if (waktuDetik > 0.5) {

      let kecepatan = (jarak / waktuDetik) * 3.6;

      if (kecepatan > 200) kecepatan = 0;

      document.getElementById("speedVal").textContent =
        Math.round(kecepatan);

      lastPosForSpeed = {

        lat: lat,

        lng: lng

      };

      lastTimeForSpeed = now;

    }

  } else {

    lastPosForSpeed = {

      lat: lat,

      lng: lng

    };

    lastTimeForSpeed = now;

  }

}

function updateHeading(lat, lng) {

  if (window._lastPosHeading) {

    const dLat = lat - window._lastPosHeading.lat;

    const dLng = lng - window._lastPosHeading.lng;

    const dist = Math.sqrt(dLat * dLat + dLng * dLng);

    if (dist > 0.00003) {

      const bearing = Math.atan2(

        dLng * Math.cos(lat * Math.PI / 180),

        dLat

      ) * 180 / Math.PI;

      heading = (bearing + 360) % 360;

      const mobilEl = document.getElementById("mobilSaya");

      if (mobilEl) {

        mobilEl.style.transform =
          "rotate(" + heading + "deg)";

      }

      window._lastPosHeading = {

        lat: lat,

        lng: lng

      };

    }

  } else {

    window._lastPosHeading = {

      lat: lat,

      lng: lng

    };

  }

}

function muatSuara() {

  const daftarSuara = window.speechSynthesis.getVoices();

  const suaraID = daftarSuara.filter(function(s) {

    return s.lang.includes("id") || s.lang.includes("ID");

  });

  if (suaraID.length > 0) {

    const perempuan = suaraID.find(function(s) {

      return (

        s.name.toLowerCase().includes("female") ||

        s.name.toLowerCase().includes("wanita")

      );

    });

    suaraPerempuan = perempuan || suaraID[0];

  } else {

    const inggris = daftarSuara.filter(function(s) {

      return s.lang.includes("en");

    });

    suaraPerempuan =

      inggris.find(function(s) {

        return s.name.toLowerCase().includes("female");

      }) ||

      inggris[0] ||

      daftarSuara[0];

  }

}

if ("speechSynthesis" in window) {

  window.speechSynthesis.onvoiceschanged = muatSuara;

  muatSuara();

}

function putarSuara(teks) {

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const ucapan = new SpeechSynthesisUtterance(teks);

  ucapan.lang = "id-ID";

  ucapan.rate = 0.9;

  ucapan.pitch = 1.0;

  if (suaraPerempuan) {
    ucapan.voice = suaraPerempuan;
  }

  window.speechSynthesis.speak(ucapan);

}

function cekFormRencana() {

function parseShareLocation(text) {

  let m = text.match(
    /(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/
  );

  if (m) {

    const a = parseFloat(m[1]);

    const b = parseFloat(m[2]);

    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) {

      return {

        lat: a,

        lng: b

      };

    }

  }

  m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);

  if (m) {

    return {

      lat: parseFloat(m[1]),

      lng: parseFloat(m[2])

    };

  }

  return null;

}

async function tempelWA() {

  try {

    const text = await navigator.clipboard.readText();

    if (!text) {

      showToast("Clipboard kosong");

    const parsed = parseShareLocation(text);

    if (parsed) {

      document.getElementById("inputTujuan").value =

        parsed.lat.toFixed(6) + ", " +

      setTujuan(

      cekFormRencana();

      document.getElementById("inputTujuan").value = text;

      titikTujuan = null;

      showToast(

// ============================================================
// PENCARIAN ALAMAT TOMTOM
// ============================================================

async function cariAlamatTomTom(query) {

  if (!tomtomSiap()) {

    throw new Error("API KEY TomTom belum diisi.");

  }

  let url =

    "https://api.tomtom.com/search/2/search/" +

    encodeURIComponent(query) +

    ".json?key=" +

    encodeURIComponent(TOMTOM_API_KEY) +

    "&countrySet=ID&language=id-ID&limit=1";

  if (posisiSaya) {

    url +=

      "&lat=" + posisiSaya.lat +

      "&lon=" + posisiSaya.lng;

  }

  const response = await fetch(url);

  if (!response.ok) {

    throw new Error(
      "TomTom Search gagal (" + response.status + ")."
    );

  }

  const data = await response.json();

  if (!data.results || !data.results.length) {

    return null;

  }

  const hasil = data.results[0];

  return {

    lat: hasil.position.lat,

    lng: hasil.position.lon,

    nama:

      hasil.address && hasil.address.freeformAddress

        ? hasil.address.freeformAddress

        : query

  };

}

// ============================================================
// ROUTING TOMTOM
// ============================================================

async function hitungRuteTomTom(force) {

  if (!posisiSaya || !titikTujuan || !map) return;

  if (calcInProgress) return;

  const now = Date.now();

  if (!force && now - lastRuteCalc < 5000) return;

  lastRuteCalc = now;

  calcInProgress = true;

  const lokasi =

    posisiSaya.lat + "," + posisiSaya.lng + ":" +

    titikTujuan.lat + "," + titikTujuan.lng;

  const url =

    "https://api.tomtom.com/routing/1/calculateRoute/" +

    lokasi +

    "/json?key=" +

    encodeURIComponent(TOMTOM_API_KEY) +

    "&routeType=fastest&traffic=true&travelMode=car" +

    "&instructionsType=text&language=id-ID&routeRepresentation=polyline";

  try {

    const response = await fetch(url);

    if (!response.ok) {

      const detail = await response.text();

      throw new Error(

        "TomTom Routing gagal (" +

        response.status +

        "). " +

        detail.slice(0, 180)

      );

    }

    const data = await response.json();

    if (

      data.routes &&

      data.routes.length > 0 &&

      data.routes[0].legs &&

      data.routes[0].legs[0]

    ) {

      ruteData = data.routes[0];

      const points = ruteData.legs[0].points || [];

      ruteAsli = points.map(function(p) {

        return {

          lat: p.latitude,

          lng: p.longitude

        };

      });

      if (ruteAsli.length < 2) {

        throw new Error(
          "TomTom tidak mengembalikan geometri rute."
        );

      }

      instruksiTerakhir = "";

      belokan200SudahBerbunyi = false;

      belokan50SudahBerbunyi = false;

      isOffRoute = false;

      siapkanLayerPeta(map);

      gambarRuteNeon(0);

      updateInfoJarakDariIdx(0);

      updateInstruksi(0);

    } else {

      showToast(
        "TomTom tidak menemukan rute untuk perjalanan ini."
      );

    }

  } catch (err) {

    console.error("TomTom Routing error:", err);

    showToast(
      err.message || "Koneksi rute TomTom gagal."
    );

  } finally {

    calcInProgress = false;

  }

}

// ============================================================
// CEK POSISI PADA RUTE
// ============================================================

function cekPosisiDiRute() {

  if (!posisiSaya || ruteAsli.length === 0) return;

  let jarakMin = Infinity;

  let idxTerdekat = 0;

  for (let i = 0; i < ruteAsli.length; i++) {

    const d = jarakMeter(

      posisiSaya.lat,

      posisiSaya.lng,

      ruteAsli[i].lat,

      ruteAsli[i].lng

    );

    if (d < jarakMin) {

      jarakMin = d;

      idxTerdekat = i;

    }

  }

  const TOLERANSI = 55;

  if (jarakMin > TOLERANSI) {

    if (!isOffRoute) {

      isOffRoute = true;

      showToast(
        "Anda keluar jalur. Menghitung rute baru..."
      );

      hitungRuteTomTom(true);

    }

  } else {

    isOffRoute = false;

    gambarRuteNeon(idxTerdekat);

    updateInfoJarakDariIdx(idxTerdekat);

    updateInstruksi(idxTerdekat);

  }

}

// ============================================================
// GAMBAR GARIS NEON TOMTOM
// ============================================================

function gambarRuteNeon(idxTerdekat) {

  if (!map || !ruteAsli.length) return;

  if (!map.isStyleLoaded()) {

    map.once("load", function() {

      gambarRuteNeon(idxTerdekat);

    });

    return;

  }

  siapkanLayerPeta(map);

  // RUTE YANG SUDAH DILALUI

  const lewat = ruteAsli

    .slice(0, idxTerdekat + 1)

    .map(function(p) {

      return [p.lng, p.lat];

    });

  // RUTE YANG BELUM DILALUI

  const sisa = ruteAsli

    .slice(idxTerdekat)

    .map(function(p) {

      return [p.lng, p.lat];

    });

  const sourceLewat = map.getSource(TT_SOURCE_RUTE_LEWAT);

  const sourceGlow = map.getSource(TT_SOURCE_RUTE_GLOW);

  const sourceSisa = map.getSource(TT_SOURCE_RUTE_SISA);

  if (sourceLewat) {

    sourceLewat.setData(

      lewat.length > 1

        ? featureGaris(lewat)

        : geojsonKosong()

    );

  }

  if (sourceGlow) {

    sourceGlow.setData(

      sisa.length > 1

        ? featureGaris(sisa)

        : geojsonKosong()

    );

  }

  if (sourceSisa) {

    sourceSisa.setData(

      sisa.length > 1

        ? featureGaris(sisa)

        : geojsonKosong()

    );

  }

}

// ============================================================
// PERHITUNGAN JARAK SISA
// ============================================================

function hitungJarakSisaDariIdx(idx) {

  let sisa = 0;

  for (let i = idx; i < ruteAsli.length - 1; i++) {

    sisa += jarakMeter(

      ruteAsli[i].lat,

      ruteAsli[i].lng,

      ruteAsli[i + 1].lat,

      ruteAsli[i + 1].lng

    );

  }

  return sisa;

}

function hitungJarakTerpakaiDariIdx(idx) {

  let terpakai = 0;

  for (let i = 0; i < idx; i++) {

    terpakai += jarakMeter(

      ruteAsli[i].lat,

      ruteAsli[i].lng,

      ruteAsli[i + 1].lat,

      ruteAsli[i + 1].lng

    );

  }

  return terpakai;

}

// ============================================================
// INFORMASI JARAK DAN WAKTU
// ============================================================

function updateInfoJarakDariIdx(idxTerdekat) {

  if (!ruteData || !ruteAsli.length) return;

  const sisa = hitungJarakSisaDariIdx(idxTerdekat);

  document.getElementById("sisaJarak").textContent =

    formatJarak(sisa);

  // ESTIMASI WAKTU TOMTOM

  const totalJarak = Number(

    ruteData.summary && ruteData.summary.lengthInMeters

      ? ruteData.summary.lengthInMeters

      : hitungJarakSisaDariIdx(0)

  );

  const totalWaktu = Number(

    ruteData.summary && ruteData.summary.travelTimeInSeconds

      ? ruteData.summary.travelTimeInSeconds

      : 0

  );

  const detikSisa =

    totalJarak > 0 && totalWaktu > 0

      ? totalWaktu * Math.min(1, sisa / totalJarak)

      : sisa / (30000 / 3600);

  const menitSisa = Math.round(detikSisa / 60);

  const teksWaktu =

    menitSisa < 60

      ? menitSisa + " mnt"

      : Math.floor(menitSisa / 60) +

        " j " +

        (menitSisa % 60) +

        " m";

  document.getElementById("estimasiWaktu").textContent =

    teksWaktu;

  const waktuTiba = new Date(

    Date.now() + detikSisa * 1000

  );

  document.getElementById("jamTiba").textContent =

    waktuTiba.toLocaleTimeString("id-ID", {

      hour: "2-digit",

      minute: "2-digit"

    }).replace(".", ":");

}

// ============================================================
// INSTRUKSI BELOKAN TOMTOM
// ============================================================

function updateInstruksi(idxTerdekat) {

  if (

    !ruteData ||

    !ruteData.guidance ||

    !ruteData.guidance.instructions

  ) return;

  const instructions = ruteData.guidance.instructions;

  if (!instructions.length) return;

  const jarakKeIdx =

    hitungJarakTerpakaiDariIdx(idxTerdekat);

  let instruksiBerikutnya =

    instructions[instructions.length - 1];

  for (let i = 0; i < instructions.length; i++) {

    if (

      instructions[i].routeOffsetInMeters >= jarakKeIdx

    ) {

      instruksiBerikutnya = instructions[i];

      break;

    }

  }

  const jarakInstruksi = Number(

    instruksiBerikutnya.routeOffsetInMeters || jarakKeIdx

  );

  const distToNextTurn = Math.max(

    0,

    jarakInstruksi - jarakKeIdx

  );

  const maneuver = String(

    instruksiBerikutnya.maneuver || ""

  ).toUpperCase();

  const message =

    instruksiBerikutnya.message || "Lanjutkan perjalanan";

  let icon = "⬆️";

  let teks = message;

  if (maneuver.includes("ARRIVE")) {

    icon = "🏁";

    teks = "Tiba di Tujuan";

  } else if (maneuver.includes("UTURN")) {

    icon = "🔄";

    teks = "Putar Balik";

  } else if (maneuver.includes("LEFT")) {

    icon = "⬅️";

    teks = message || "Belok Kiri";

  } else if (maneuver.includes("RIGHT")) {

    icon = "➡️";

    teks = message || "Belok Kanan";

  } else if (maneuver.includes("ROUNDABOUT")) {

    icon = "🔄";

    teks = message || "Masuk Bundaran";

  } else if (

    maneuver.includes("EXIT") ||

    maneuver.includes("MOTORWAY")

  ) {

    icon = "↗️";

  } else if (maneuver.includes("KEEP")) {

    icon = maneuver.includes("LEFT") ? "↖️" : "↗️";

  }

  document.getElementById("turnIcon").textContent = icon;

  document.getElementById("turnText").textContent = teks;

  document.getElementById("turnDist").textContent =

    distToNextTurn > 0

      ? formatJarak(distToNextTurn) + " lagi"

      : "Segera";

  // SUARA INSTRUKSI

  const isTurnInstruction =

    !maneuver.includes("STRAIGHT") &&

    !maneuver.includes("DEPART") &&

    !maneuver.includes("ARRIVE") &&

    maneuver.length > 0;

  if (isTurnInstruction) {

    if (

      distToNextTurn <= 210 &&

      distToNextTurn > 190 &&

      !belokan200SudahBerbunyi

    ) {

      putarSuara("Dalam 200 meter, " + teks);

      belokan200SudahBerbunyi = true;

    }

    if (

      distToNextTurn <= 60 &&

      distToNextTurn > 40 &&

      !belokan50SudahBerbunyi

    ) {

      putarSuara("Dalam 50 meter, " + teks);

      belokan50SudahBerbunyi = true;

    }

  }

  if (teks !== instruksiTerakhir) {

    instruksiTerakhir = teks;

    belokan200SudahBerbunyi = false;

    belokan50SudahBerbunyi = false;

  }

}

// ============================================================
// UTILITAS JARAK
// ============================================================

function jarakMeter(lat1, lng1, lat2, lng2) {

  const R = 6371000;

  const dLat = (lat2 - lat1) * Math.PI / 180;

  const dLng = (lng2 - lng1) * Math.PI / 180;

  const a =

    Math.sin(dLat / 2) * Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *

    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLng / 2) * Math.sin(dLng / 2);

  return R * 2 * Math.atan2(

    Math.sqrt(a),

    Math.sqrt(1 - a)

  );

}

function formatJarak(meter) {

  if (meter < 1000) {

    return Math.round(meter) + " m";

  }

  return (meter / 1000).toFixed(1) + " km";

}
