<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAVIGASI LIVE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #f4f3f8; color: #202020; overflow: hidden; }

/* ================= HALAMAN 1: PERENCANAAN ================= */
#halamanRencana {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #f4f3f8; z-index: 2000; display: flex; flex-direction: column;
}
.header-rencana {
  background: #7138e8; color: white; padding: 20px 15px; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.header-rencana h1 { margin: 0; font-size: 20px; font-weight: 800; }
.header-rencana p { margin: 5px 0 0; font-size: 12px; opacity: .9; }

.form-container { padding: 20px; flex: 1; overflow-y: auto; }
.form-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: #7138e8; margin-bottom: 8px; }
.form-group input {
  width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; outline: none; margin-bottom: 10px;
}
.form-group input:focus { border-color: #7138e8; }
.form-group input[readonly] { background: #f9f9f9; color: #666; }
.btn-group { display: flex; gap: 8px; }
.btn-group button {
  flex: 1; padding: 10px; border: 0; border-radius: 8px;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.btn-wa { background: #25D366; color: white; }
.btn-peta { background: #7138e8; color: white; }

.btn-mulai {
  display: block; width: calc(100% - 40px); margin: 20px; padding: 16px;
  background: #7138e8; color: white; border: 0; border-radius: 12px;
  font-size: 16px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 15px rgba(113, 56, 232, 0.4);
}
.btn-mulai:disabled { background: #aaa; box-shadow: none; }

/* ================= HALAMAN 2: NAVIGASI ================= */
#halamanNavigasi { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; }
#map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

.panel-atas {
  position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
  background: rgba(30, 30, 46, 0.95); color: white; border-radius: 12px;
  padding: 10px 15px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,.3);
}
.btn-batal {
  background: #ff3b30; color: white; border: 0; border-radius: 8px;
  width: 36px; height: 36px; font-size: 18px; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.tujuan-text { flex: 1; font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-gps { font-size: 10px; color: #18a84b; font-weight: bold; display: block; margin-top: 2px;}

.instruksi-box {
  position: fixed; top: 70px; left: 10px; right: 10px; z-index: 999;
  background: #1e1e2e; color: white; border-radius: 12px;
  padding: 12px 15px; box-shadow: 0 3px 15px rgba(0,0,0,.25);
  display: flex; align-items: center; gap: 15px;
}
.instruksi-icon { font-size: 30px; }
.instruksi-text { font-size: 16px; font-weight: 800; }
.instruksi-dist { font-size: 12px; color: #aaa; margin-top: 4px; }

.panel-bawah {
  position: fixed; bottom: 15px; left: 10px; right: 10px; z-index: 1000;
  background: white; border-radius: 16px; padding: 15px;
  box-shadow: 0 -4px 20px rgba(0,0,0,.15);
  display: flex; justify-content: space-between; align-items: center;
}
.info-box { text-align: center; flex: 1; }
.info-label { font-size: 10px; color: #888; font-weight: 700; text-transform: uppercase; }
.info-value { font-size: 18px; font-weight: 800; color: #7138e8; margin-top: 2px; }

.btn-recenter {
  position: fixed; right: 15px; bottom: 100px; z-index: 1000;
  width: 50px; height: 50px; border-radius: 50%;
  background: #18a84b; color: white; border: 3px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,.3); font-size: 22px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* ================= IKON & TOAST ================= */
.marker-mobil {
  width: 45px; height: 45px;
  filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4));
  transition: transform 0.5s linear;
}
.marker-mobil svg { width: 100%; height: 100%; }

.toast {
  position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
  background: #333; color: white; padding: 10px 18px; border-radius: 20px;
  font-size: 13px; z-index: 3000; opacity: 0; transition: opacity .3s;
  pointer-events: none; max-width: 85%; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ================= HALAMAN 1: RENCANA ================= -->
<div id="halamanRencana">
  <div class="header-rencana">
    <h1>NAVIGASI LIVE</h1>
    <p>Atur Perjalanan Anda</p>
  </div>
  
  <div class="form-container">
    <div class="form-group">
      <label>📍 TITIK AWAL (Posisi Saat Ini)</label>
      <input type="text" id="inputAwal" readonly value="Mencari GPS...">
    </div>

    <div class="form-group">
      <label>🎯 TITIK TUJUAN</label>
      <input type="text" id="inputTujuan" placeholder="Ketik alamat atau tempel link...">
      <div class="btn-group">
        <button class="btn-wa" onclick="tempelWA()">📋 Tempel WA</button>
        <button class="btn-peta" onclick="pilihDiPeta()">🗺️ Pilih di Peta</button>
      </div>
    </div>
  </div>

  <button class="btn-mulai" id="btnMulai" onclick="mulaiPerjalanan()" disabled>🚀 MULAI PERJALANAN</button>
</div>

<!-- ================= HALAMAN 2: NAVIGASI ================= -->
<div id="halamanNavigasi">
  <div id="map"></div>

  <div class="panel-atas">
    <button class="btn-batal" onclick="batalPerjalanan()">✖</button>
    <div class="tujuan-text">
      <div id="tujuanNama">Tujuan</div>
      <span class="status-gps" id="gpsStatus">MENCARI GPS...</span>
    </div>
  </div>

  <div class="instruksi-box" id="instruksiBox" style="display:none;">
    <div class="instruksi-icon" id="turnIcon">⬆️</div>
    <div>
      <div class="instruksi-text" id="turnText">Lurus</div>
      <div class="instruksi-dist" id="turnDist">-</div>
    </div>
  </div>

  <button class="btn-recenter" id="btnRecenter" onclick="kembaliKePosisiSaya()">📍</button>

  <div class="panel-bawah">
    <div class="info-box">
      <div class="info-label">Sisa Jarak</div>
      <div class="info-value" id="sisaJarak">-</div>
    </div>
    <div class="info-box" style="border-left: 1px solid #eee; border-right: 1px solid #eee;">
      <div class="info-label">Waktu Tempuh</div>
      <div class="info-value" id="estimasiWaktu">-</div>
    </div>
    <div class="info-box">
      <div class="info-label">Tiba Pukul</div>
      <div class="info-value" id="jamTiba">-</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ================= STATE =================
let map;
let posisiSaya = null;
let titikTujuan = null;
let followMode = true;
let modePilihTujuan = false;
let heading = 0;

let markerSaya = null;
let markerTujuan = null;
let circleAkurasi = null;

// Layer untuk Rute
let ruteLayerLewat = null; 
let ruteLayerSisa = null;  
let ruteLayerGlow = null;  

let ruteData = null;
let ruteCoordinates = [];
let watchId = null;
let lastRuteCalc = 0;
let calcInProgress = false;

// ================= ICONS =================
// Ikon Mobil Warna Putih dengan Aksen Violet & Oranye
const iconSaya = L.divIcon({
  className: "",
  html: `
    <div class="marker-mobil" id="mobilSaya">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="25" y="10" width="50" height="80" rx="15" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
        <path d="M 30 25 Q 50 15 70 25 L 70 35 Q 50 30 30 35 Z" fill="#333333" opacity="0.8"/>
        <path d="M 30 75 Q 50 85 70 75 L 70 65 Q 50 70 30 65 Z" fill="#333333" opacity="0.8"/>
        <rect x="45" y="10" width="10" height="20" fill="#7138e8" />
        <rect x="45" y="40" width="10" height="30" fill="#ff8100" />
        <rect x="27" y="12" width="10" height="4" rx="2" fill="#fffaaa" />
        <rect x="63" y="12" width="10" height="4" rx="2" fill="#fffaaa" />
        <rect x="15" y="30" width="10" height="5" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
        <rect x="75" y="30" width="10" height="5" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
      </svg>
    </div>
  `,
  iconSize: [45, 45],
  iconAnchor: [22.5, 22.5]
});

const iconTujuan = L.divIcon({
  className: "",
  html: '<div style="width:36px;height:36px;border-radius:50% 50% 50% 0;background:#ff8100;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.35);transform:rotate(-45deg);position:relative;"><div style="position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);"></div></div>',
  iconSize: [36, 36],
  iconAnchor: [18, 36]
});

// ================= INIT MAP =================
function initMap() {
  map = L.map("map", {
    zoomControl: false,
    attributionControl: false
  }).setView([-6.387, 106.936], 16);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  // Event saat peta digeser manual
  map.on('dragstart', function() {
    followMode = false;
    const btn = document.getElementById('btnRecenter');
    if (btn) btn.style.background = '#7138e8'; // Berubah ungu
  });

  // Event klik peta (untuk fitur Pilih di Peta)
  map.on('click', function(e) {
    if (!modePilihTujuan) return;
    modePilihTujuan = false;
    
    // Kembali ke halaman rencana
    document.getElementById('halamanNavigasi').style.display = 'none';
    document.getElementById('halamanRencana').style.display = 'flex';
    
    // Isi input tujuan dengan koordinat yang diklik
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;
    document.getElementById('inputTujuan').value = lat.toFixed(6) + ', ' + lon.toFixed(6);
    
    showToast('Lokasi tujuan dipilih dari peta');
    cekFormRencana();
  });
}

// ================= GPS & UPDATE POSISI =================
function mulaiGPS() {
  if (!navigator.geolocation) {
    showToast('Browser tidak mendukung GPS');
    return;
  }
  
  watchId = navigator.geolocation.watchPosition(
    onPosition,
    onPositionError,
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
  );
}

function onPosition(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const acc = position.coords.accuracy;

  posisiSaya = { lat: lat, lon: lon, accuracy: acc };
  
  // Update status di panel atas
  document.getElementById('gpsStatus').textContent = 'GPS AKTIF (Akurasi: ' + Math.round(acc) + 'm)';
  document.getElementById('gpsStatus').style.color = '#18a84b';

  // Update input awal di halaman rencana (jika halaman rencana sedang terbuka)
  const inputAwal = document.getElementById('inputAwal');
  if (inputAwal && document.getElementById('halamanRencana').style.display !== 'none') {
    inputAwal.value = lat.toFixed(6) + ', ' + lon.toFixed(6);
    cekFormRencana();
  }

  // Update Marker & Akurasi
  if (!markerSaya) {
    markerSaya = L.marker([lat, lon], { icon: iconSaya, zIndexOffset: 1000 }).addTo(map);
  } else {
    markerSaya.setLatLng([lat, lon]);
  }

  if (!circleAkurasi) {
    circleAkurasi = L.circle([lat, lon], {
      radius: acc, color: '#7138e8', fillColor: '#7138e8',
      fillOpacity: 0.1, weight: 1
    }).addTo(map);
  } else {
    circleAkurasi.setLatLng([lat, lon]);
    circleAkurasi.setRadius(acc);
  }

  // Update heading (arah putar mobil)
  updateHeading(lat, lon);

  // Hitung rute jika sedang dalam perjalanan
  if (titikTujuan && document.getElementById('halamanNavigasi').style.display === 'block') {
    hitungRute();
  }

  // Kunci peta di tengah jika followMode aktif
  if (followMode) {
    map.setView([lat, lon], map.getZoom(), { animate: true, duration: 1.0 });
  }
}

function onPositionError(err) {
  console.warn(err);
  const statusEl = document.getElementById('gpsStatus');
  statusEl.textContent = 'GPS ERROR / IZIN DITOLAK';
  statusEl.style.color = '#ff3b30';
}

function updateHeading(lat, lon) {
  if (window._lastPosHeading) {
    const dLat = lat - window._lastPosHeading.lat;
    const dLon = lon - window._lastPosHeading.lon;
    const dist = Math.sqrt(dLat * dLat + dLon * dLon);
    
    // Jika pergerakan cukup jauh, hitung sudut baru
    if (dist > 0.00003) {
      const bearing = Math.atan2(dLon * Math.cos(lat * Math.PI / 180), dLat) * 180 / Math.PI;
      heading = (bearing + 360) % 360;
      
      // Putar ikon mobil
      const mobilEl = document.getElementById('mobilSaya');
      if (mobilEl) {
        mobilEl.style.transform = 'rotate(' + heading + 'deg)';
      }
      window._lastPosHeading = { lat: lat, lon: lon };
    }
  } else {
    window._lastPosHeading = { lat: lat, lon: lon };
  }
}

// ================= UI & TOAST =================
function showToast(msg, duration) {
  duration = duration || 2500;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, duration);
}

function kembaliKePosisiSaya() {
  followMode = true;
  const btn = document.getElementById('btnRecenter');
  if (btn) btn.style.background = '#18a84b'; // Kembali hijau
  
  if (posisiSaya) {
    map.setView([posisiSaya.lat, posisiSaya.lon], map.getZoom(), { animate: true });
  } else {
    showToast('Posisi GPS belum tersedia');
  }
}
