<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NAVIGASI PRIBADI (TOMTOM)</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #f4f3f8; color: #202020; overflow: hidden; }

/* ================= HALAMAN 1: PERENCANAAN ================= */
#halamanRencana {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #f4f3f8; z-index: 2000; display: flex; flex-direction: column;
}
.header-rencana {
  background: #7138e8; color: white; padding: 20px 15px; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.header-rencana h1 { margin: 0; font-size: 20px; font-weight: 800; }
.header-rencana p { margin: 5px 0 0; font-size: 12px; opacity: .9; }

.form-container { padding: 20px; flex: 1; overflow-y: auto; }
.form-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: #7138e8; margin-bottom: 8px; }
.form-group input {
  width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; outline: none; margin-bottom: 10px;
}
.form-group input:focus { border-color: #7138e8; }
.form-group input[readonly] { background: #f9f9f9; color: #666; }
.btn-group { display: flex; gap: 8px; }
.btn-group button {
  flex: 1; padding: 10px; border: 0; border-radius: 8px;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.btn-wa { background: #25D366; color: white; }
.btn-peta { background: #7138e8; color: white; }

/* Peta Mini di Halaman Rencana */
#mapRencana { 
  width: 100%; height: 200px; 
  border-radius: 12px; margin-top: 10px; 
  display: none; 
  border: 2px solid #7138e8;
}

.btn-mulai {
  display: block; width: calc(100% - 40px); margin: 20px; padding: 16px;
  background: #7138e8; color: white; border: 0; border-radius: 12px;
  font-size: 16px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 15px rgba(113, 56, 232, 0.4);
}
.btn-mulai:disabled { background: #aaa; box-shadow: none; }

/* ================= HALAMAN 2: NAVIGASI (FULLSCREEN) ================= */
#halamanNavigasi { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; }
#map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

.panel-atas {
  position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
  background: rgba(30, 30, 46, 0.95); color: white; border-radius: 12px;
  padding: 10px 15px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,.3);
}
.btn-batal {
  background: transparent; width: 36px; height: 36px; padding: 0; border: none; 
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.tujuan-text { flex: 1; font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-gps { font-size: 10px; color: #18a84b; font-weight: bold; display: block; margin-top: 2px;}

.instruksi-box {
  position: fixed; top: 70px; left: 10px; right: 10px; z-index: 999;
  background: #1e1e2e; color: white; border-radius: 12px;
  padding: 12px 15px; box-shadow: 0 3px 15px rgba(0,0,0,.25);
  display: none; align-items: center; gap: 15px;
}
.instruksi-icon { font-size: 30px; }
.instruksi-text { font-size: 16px; font-weight: 800; }
.instruksi-dist { font-size: 12px; color: #aaa; margin-top: 4px; }

/* CSS Foto Driver */
.foto-driver {
  width: 42px; height: 42px; border-radius: 50%;
  object-fit: cover; border: 2px solid #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  margin-left: auto;
}

/* Indikator Kecepatan */
.speedometer {
  position: fixed; bottom: 100px; left: 15px; z-index: 1000;
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(30, 30, 46, 0.9); color: white;
  border: 3px solid #7138e8;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.speed-val { font-size: 18px; font-weight: 800; line-height: 1; }
.speed-unit { font-size: 9px; color: #aaa; margin-top: 2px; }

.btn-recenter {
  position: fixed; right: 15px; bottom: 100px; z-index: 1000;
  width: 50px; height: 50px; border-radius: 50%;
  background: #18a84b; color: white; border: 3px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,.3); font-size: 22px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

.panel-bawah {
  position: fixed; bottom: 15px; left: 10px; right: 10px; z-index: 1000;
  background: white; border-radius: 16px; padding: 15px;
  box-shadow: 0 -4px 20px rgba(0,0,0,.15);
  display: flex; justify-content: space-between; align-items: center;
}
.info-box { text-align: center; flex: 1; }
.info-label { font-size: 10px; color: #888; font-weight: 700; text-transform: uppercase; }
.info-value { font-size: 18px; font-weight: 800; color: #7138e8; margin-top: 2px; }

/* ================= TOAST ================= */
.toast {
  position: fixed; left: 50%; bottom: 170px; transform: translateX(-50%);
  background: #333; color: white; padding: 10px 18px; border-radius: 20px;
  font-size: 13px; z-index: 3000; opacity: 0; transition: opacity .3s;
  pointer-events: none; max-width: 85%; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ================= HALAMAN 1: RENCANA ================= -->
<div id="halamanRencana">
  <div class="header-rencana">
    <h1>NAVIGASI PRIBADI</h1>
    <p>Atur Perjalanan Anda</p>
  </div>
  
  <div class="form-container">
    <div class="form-group">
      <label>📍 TITIK AWAL (Posisi Saat Ini)</label>
      <input type="text" id="inputAwal" readonly value="Mencari GPS...">
    </div>

    <div class="form-group">
      <label>🎯 TITIK TUJUAN</label>
      <input type="text" id="inputTujuan" placeholder="Ketik alamat tujuan...">
      <div class="btn-group">
        <button class="btn-wa" onclick="tempelWA()">📋 Tempel WA</button>
        <button class="btn-peta" onclick="pilihDiPeta()">🗺️ Pilih di Peta</button>
      </div>
      
      <div id="mapRencana"></div>
    </div>
  </div>

  <button class="btn-mulai" id="btnMulai" onclick="mulaiPerjalanan()" disabled>🚀 MULAI PERJALANAN</button>
</div>

<!-- ================= HALAMAN 2: NAVIGASI ================= -->
<div id="halamanNavigasi">
  <div id="map"></div>

  <div class="panel-atas">
    <button class="btn-batal" onclick="batalPerjalanan()">
      <svg viewBox="0 0 100 120" style="width: 32px; height: 32px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));">
        <path d="M 50 0 C 22.4 0 0 22.4 0 50 C 0 85 50 120 50 120 C 50 120 100 85 100 50 C 100 22.4 77.6 0 50 0 Z" fill="#ff8100" />
        <circle cx="50" cy="45" r="20" fill="#ffffff" opacity="0.2"/>
      </svg>
    </button>
    <div class="tujuan-text">
      <div id="tujuanNama">Tujuan</div>
      <span class="status-gps" id="gpsStatus">MENCARI GPS...</span>
    </div>
  </div>

  <div class="instruksi-box" id="instruksiBox">
    <div class="instruksi-icon" id="turnIcon">⬆️</div>
    <div style="flex: 1;">
      <div class="instruksi-text" id="turnText">Driver: SOREN SUHENDRO</div>
      <div class="instruksi-dist" id="turnDist">-</div>
    </div>
    <img src="foto-driver.JPG" alt="Driver" class="foto-driver">
  </div>

  <div class="speedometer">
    <div class="speed-val" id="speedVal">0</div>
    <div class="speed-unit">km/j</div>
  </div>

  <button class="btn-recenter" id="btnRecenter" onclick="kembaliKePosisiSaya()">📍</button>

  <div class="panel-bawah">
    <div class="info-box">
      <div class="info-label">Sisa Jarak</div>
      <div class="info-value" id="sisaJarak">-</div>
    </div>
    <div class="info-box" style="border-left: 1px solid #eee; border-right: 1px solid #eee;">
      <div class="info-label">Waktu Tempuh</div>
      <div class="info-value" id="estimasiWaktu">-</div>
    </div>
    <div class="info-box">
      <div class="info-label">Tiba Pukul</div>
      <div class="info-value" id="jamTiba">-</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- PENTING: GANTI 'YOUR_TOMTOM_API_KEY' DENGAN API KEY TOMTOM ANDA -->
<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.25.0/maps/maps-web.min.js"></script>
<script>
// ================= STATE =================
// GANTI DENGAN API KEY TOMTOM ANDA
const TOMTOM_API_KEY = 'duPP6hddpLvDr8U7xEN9Pit3pMKXD3Xm'; 

let map;        // Peta Utama (Halaman 2)
let mapRencana; // Peta Mini (Halaman 1)
let posisiSaya = null;
let titikTujuan = null;
let followMode = true;
let modePilihTujuan = false;
let heading = 0;

// Marker & Objek TomTom
let markerSaya = null;
let markerTujuan = null;
let markerTujuanRencana = null;

// Layer Rute
let rutePolylineGlow = null;
let rutePolylineCore = null;
let rutePolylineLewat = null;

// State Rute
let ruteData = null;
let ruteAsli = []; 
let watchId = null;
let lastRuteCalc = 0;
let calcInProgress = false;
let isOffRoute = false;

// State Kecepatan
let lastPosForSpeed = null;
let lastTimeForSpeed = 0;

// State Suara & Wake Lock
let wakeLock = null;
let suaraPerempuan = null;
let instruksiTerakhir = ""; 
let belokan200SudahBerbunyi = false;
let belokan50SudahBerbunyi = false;

// ================= INIT MAP (TOMTOM) =================
function initMap() {
  const defaultLoc = { lat: -6.387, lng: 106.936 };

  // 1. Inisialisasi Peta Utama (Halaman 2)
  map = tt.map({
    key: TOMTOM_API_KEY,
    container: 'map',
    center: defaultLoc,
    zoom: 16,
    pitch: 0, // 0 = top-down
    bearing: 0 // Rotasi peta (Heading Up)
  });

  // 2. Inisialisasi Peta Mini (Halaman 1)
  mapRencana = tt.map({
    key: TOMTOM_API_KEY,
    container: 'mapRencana',
    center: defaultLoc,
    zoom: 15
  });

  // Sembunyikan UI bawaan TomTom agar bersih
  map.removeControl(map.controls.get('zoomControl'));

  // Event jika peta digeser manual
  map.on('dragstart', function() {
    followMode = false;
    const btn = document.getElementById('btnRecenter');
    if (btn) btn.style.background = '#7138e8'; 
  });

  // Event klik peta (Pilih di Peta)
  map.on('click', function(e) {
    if (!modePilihTujuan) return;
    modePilihTujuan = false;
    
    document.getElementById('halamanNavigasi').style.display = 'none';
    document.getElementById('halamanRencana').style.display = 'flex';
    
    const lat = e.lngLat.lat;
    const lng = e.lngLat.lng;
    setTujuan(lat, lng, 'Titik dari Peta');
    document.getElementById('inputTujuan').value = lat.toFixed(6) + ', ' + lng.toFixed(6);
    
    setTimeout(() => { tampilkanPetaRencana(lat, lng); }, 100);
    showToast('Lokasi tujuan dipilih dari peta');
    cekFormRencana();
  });

  // Mulai GPS setelah peta siap
  mulaiGPS();
}

// ================= FUNGSI PETA MINI =================
function tampilkanPetaRencana(lat, lng) {
  const container = document.getElementById('mapRencana');
  container.style.display = 'block';
  
  mapRencana.resize(); // Refresh ukuran peta TomTom
  mapRencana.setCenter({ lat: lat, lng: lng });
  mapRencana.setZoom(16);

  if (markerTujuanRencana) markerTujuanRencana.remove();
  
  // Buat Pin oranye untuk TomTom
  const el = document.createElement('div');
  el.innerHTML = `
    <div style="width: 36px; height: 36px; background: #ff8100; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center;">
      <div style="width: 12px; height: 12px; background: white; border-radius: 50%;"></div>
    </div>
  `;
  
  markerTujuanRencana = new tt.Marker({ element: el, anchor: 'bottom' })
    .setLngLat([lng, lat])
    .addTo(mapRencana);
}

// ================= GPS & UPDATE POSISI =================
function mulaiGPS() {
  if (!navigator.geolocation) {
    showToast('Browser tidak mendukung GPS');
    return;
  }
  
  watchId = navigator.geolocation.watchPosition(
    onPosition,
    onPositionError,
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
  );
}

function onPosition(position) {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  const acc = position.coords.accuracy;

  posisiSaya = { lat: lat, lng: lng, accuracy: acc };
  
  // Update UI Status
  document.getElementById('gpsStatus').textContent = 'GPS AKTIF (Akurasi: ' + Math.round(acc) + 'm)';
  document.getElementById('gpsStatus').style.color = '#18a84b';

  // Update form input awal
  const inputAwal = document.getElementById('inputAwal');
  if (inputAwal && document.getElementById('halamanRencana').style.display !== 'none') {
    inputAwal.value = lat.toFixed(6) + ', ' + lng.toFixed(6);
    cekFormRencana();
  }

  // Hitung Kecepatan
  hitungKecepatan(lat, lng);

  // Update Marker & Lingkaran Akurasi
  if (!markerSaya) {
    const elMobil = document.createElement('div');
    elMobil.id = 'mobilSaya';
    elMobil.style.cssText = 'width: 65px; height: 65px; transition: transform 0.3s linear; transform-origin: center center;';
    elMobil.innerHTML = '<img src="mobil.png" style="width:100%; height:100%; object-fit:contain;">';
    
    markerSaya = new tt.Marker({ element: elMobil, anchor: 'center' })
      .setLngLat([lng, lat])
      .addTo(map);
  } else {
    markerSaya.setLngLat([lng, lat]);
  }

  // Update Heading (Arah putar mobil & Peta)
  updateHeading(lat, lng);

  // Cek Navigasi jika sedang di halaman peta
  if (titikTujuan && document.getElementById('halamanNavigasi').style.display === 'block') {
    cekPosisiDiRute();
  }

  // Kunci peta di tengah & putar peta (Heading Up)
  if (followMode) {
    map.easeTo({ center: [lng, lat], bearing: heading, duration: 1000 });
  }
}

function onPositionError(err) {
  console.warn(err);
  const statusEl = document.getElementById('gpsStatus');
  statusEl.textContent = 'GPS ERROR / IZIN DITOLAK';
  statusEl.style.color = '#ff3b30';
}

// ================= KECEPATAN & HEADING =================
function hitungKecepatan(lat, lng) {
  const now = Date.now();
  if (lastPosForSpeed && lastTimeForSpeed) {
    const dLat = lat - lastPosForSpeed.lat;
    const dLng = lng - lastPosForSpeed.lng;
    
    const R = 6371000;
    const dLatRad = dLat * Math.PI / 180;
    const dLngRad = dLng * Math.PI / 180;
    const a = Math.sin(dLatRad/2) * Math.sin(dLatRad/2) + Math.cos(lastPosForSpeed.lat * Math.PI/180) * Math.cos(lat * Math.PI/180) * Math.sin(dLngRad/2) * Math.sin(dLngRad/2);
    const jarak = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    
    const waktuDetik = (now - lastTimeForSpeed) / 1000;
    if (waktuDetik > 0.5) { 
      let kecepatan = (jarak / waktuDetik) * 3.6;
      if (kecepatan > 200) kecepatan = 0;
      document.getElementById('speedVal').textContent = Math.round(kecepatan);
      
      lastPosForSpeed = { lat: lat, lng: lng };
      lastTimeForSpeed = now;
    }
  } else {
    lastPosForSpeed = { lat: lat, lng: lng };
    lastTimeForSpeed = now;
  }
}

function updateHeading(lat, lng) {
  if (window._lastPosHeading) {
    const dLat = lat - window._lastPosHeading.lat;
    const dLng = lng - window._lastPosHeading.lng;
    const dist = Math.sqrt(dLat * dLat + dLng * dLng);
    
    if (dist > 0.00003) { 
      const bearing = Math.atan2(dLng * Math.cos(lat * Math.PI / 180), dLat) * 180 / Math.PI;
      heading = (bearing + 360) % 360;
      
      const mobilEl = document.getElementById('mobilSaya');
      if (mobilEl) {
         mobilEl.style.transform = 'rotate(' + heading + 'deg)';
      }
      
      window._lastPosHeading = { lat: lat, lng: lng };
    }
  } else {
    window._lastPosHeading = { lat: lat, lng: lng };
  }
}
  
  // ================= UTIL UI =================
function showToast(msg, duration) {
  duration = duration || 2500;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, duration);
}

function kembaliKePosisiSaya() {
  followMode = true;
  const btn = document.getElementById('btnRecenter');
  if (btn) btn.style.background = '#18a84b';
  
  if (posisiSaya) {
    map.easeTo({ center: [posisiSaya.lng, posisiSaya.lat], bearing: heading });
  } else {
    showToast('Posisi GPS belum tersedia');
  }
}

// ================= WAKE LOCK =================
async function mintaWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('Wake Lock aktif');
    }
  } catch (err) {
    console.warn('Gagal Wake Lock:', err);
  }
}

function lepasWakeLock() {
  if (wakeLock !== null) {
    wakeLock.release().then(() => { wakeLock = null; });
  }
}

document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    if (document.getElementById('halamanNavigasi').style.display === 'block') {
      mintaWakeLock();
    }
  }
});

// ================= FITUR SUARA (TEXT-TO-SPEECH) =================
function muatSuara() {
  const daftarSuara = window.speechSynthesis.getVoices();
  let suaraID = daftarSuara.filter(s => s.lang.includes('id') || s.lang.includes('ID'));
  
  if (suaraID.length > 0) {
    let perempuan = suaraID.find(s => s.name.toLowerCase().includes('female') || s.name.toLowerCase().includes('wanita'));
    suaraPerempuan = perempuan || suaraID[0]; 
  } else {
    let inggris = daftarSuara.filter(s => s.lang.includes('en'));
    suaraPerempuan = inggris.find(s => s.name.toLowerCase().includes('female')) || inggris[0] || daftarSuara[0];
  }
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = muatSuara;
  muatSuara(); 
}

function putarSuara(teks) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const ucapan = new SpeechSynthesisUtterance(teks);
  ucapan.lang = 'id-ID'; 
  ucapan.rate = 0.9;     
  ucapan.pitch = 1.0;    
  if (suaraPerempuan) ucapan.voice = suaraPerempuan;
  window.speechSynthesis.speak(ucapan);
}

// ================= FORM & PARSING LOKASI =================
function cekFormRencana() {
  const awal = document.getElementById('inputAwal').value;
  const tujuan = document.getElementById('inputTujuan').value;
  const btnMulai = document.getElementById('btnMulai');
  
  if (awal && awal !== 'Mencari GPS...' && tujuan.length > 3 && titikTujuan !== null) {
    btnMulai.disabled = false;
  } else {
    btnMulai.disabled = true;
  }
}

function parseShareLocation(text) {
  let m = text.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if (m) {
    const a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) return { lat: a, lng: b };
  }
  m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}

async function tempelWA() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) { showToast('Clipboard kosong'); return; }
    
    const parsed = parseShareLocation(text);
    if (parsed) {
      document.getElementById('inputTujuan').value = parsed.lat.toFixed(6) + ', ' + parsed.lng.toFixed(6);
      setTujuan(parsed.lat, parsed.lng, 'Koordinat dari WA');
      tampilkanPetaRencana(parsed.lat, parsed.lng);
      showToast('Koordinat berhasil diambil');
      cekFormRencana();
    } else {
      document.getElementById('inputTujuan').value = text;
      showToast('Teks alamat terdeteksi. Klik MULAI untuk mencari.');
      cekFormRencana();
    }
  } catch (err) {
    showToast('Gagal membaca clipboard.');
  }
}

function pilihDiPeta() {
  document.getElementById('halamanRencana').style.display = 'none';
  document.getElementById('halamanNavigasi').style.display = 'block';
  modePilihTujuan = true;
  
  map.resize();
  if (posisiSaya) map.setCenter({ lat: posisiSaya.lat, lng: posisiSaya.lng });
  
  showToast('Ketuk pada peta untuk memilih lokasi tujuan', 4000);
}

// ================= MULAI & BATAL PERJALANAN =================
async function mulaiPerjalanan() {
  const tujuanInput = document.getElementById('inputTujuan').value.trim();
  if (!tujuanInput) { showToast('Tujuan belum diisi'); return; }

  // Jika titikTujuan sudah ada (dari pilih peta / tempel WA), langsung jalan
  if (titikTujuan) {
    prosesMulaiPerjalanan();
    return;
  }

  // Jika teks alamat, gunakan TomTom Search API (Fuzzy Search)
  document.getElementById('btnMulai').textContent = '⏳ MENCARI LOKASI...';
  
  try {
    const url = `https://api.tomtom.com/search/2/geocode/${encodeURIComponent(tujuanInput)}.json?key=${TOMTOM_API_KEY}&countrySet=ID&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.results && data.results.length > 0) {
      const lokasi = data.results[0].position;
      const nama = data.results[0].address.freeformAddress;
      setTujuan(lokasi.lat, lokasi.lon, nama);
      tampilkanPetaRencana(lokasi.lat, lokasi.lon);
      prosesMulaiPerjalanan();
    } else {
      showToast('Alamat tidak ditemukan di TomTom.');
      document.getElementById('btnMulai').textContent = '🚀 MULAI PERJALANAN';
    }
  } catch (e) {
    showToast('Gagal mencari alamat. Periksa koneksi.');
    document.getElementById('btnMulai').textContent = '🚀 MULAI PERJALANAN';
  }
}

function prosesMulaiPerjalanan() {
  document.getElementById('btnMulai').textContent = '🚀 MULAI PERJALANAN';
  
  // Pindah Halaman
  document.getElementById('halamanRencana').style.display = 'none';
  document.getElementById('halamanNavigasi').style.display = 'block';
  
  map.resize();
  if (posisiSaya) map.setCenter({ lat: posisiSaya.lat, lng: posisiSaya.lng });

  document.getElementById('instruksiBox').style.display = 'flex';
  followMode = true;
  
  mintaWakeLock(); 
  hitungRuteTomTom(true); 

  // Suara Sapaan
  setTimeout(() => {
    putarSuara("Selamat menikmati perjalanan. Hati-hati selama perjalanan sayang.");
  }, 1500); 
}

function batalPerjalanan() {
  lepasWakeLock();
  window.speechSynthesis.cancel();

  document.getElementById('halamanNavigasi').style.display = 'none';
  document.getElementById('halamanRencana').style.display = 'flex';
  document.getElementById('btnMulai').textContent = '🚀 MULAI PERJALANAN';
  
  if (markerTujuan) markerTujuan.remove();
  if (rutePolylineGlow) map.removeLayer(rutePolylineGlow);
  if (rutePolylineCore) map.removeLayer(rutePolylineCore);
  if (rutePolylineLewat) map.removeLayer(rutePolylineLewat);
  
  titikTujuan = null;
  ruteAsli = [];
}

function setTujuan(lat, lng, nama) {
  titikTujuan = { lat: lat, lng: lng, nama: nama };
  document.getElementById('tujuanNama').textContent = nama;
  
  if (markerTujuan) markerTujuan.remove();
  
  // Buat Pin oranye untuk peta navigasi
  const el = document.createElement('div');
  el.innerHTML = `
    <div style="width: 36px; height: 36px; background: #ff8100; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center;">
      <div style="width: 12px; height: 12px; background: white; border-radius: 50%;"></div>
    </div>
  `;
  
  markerTujuan = new tt.Marker({ element: el, anchor: 'bottom' })
    .setLngLat([lng, lat])
    .addTo(map);
}
  
  // ================= LOGIKA RUTE TOMTOM =================
function cekPosisiDiRute() {
  if (!posisiSaya || ruteAsli.length === 0) return;

  let jarakMin = Infinity;
  let idxTerdekat = 0;
  
  for (let i = 0; i < ruteAsli.length; i++) {
    const d = jarakMeter(posisiSaya.lat, posisiSaya.lng, ruteAsli[i].lat, ruteAsli[i].lng);
    if (d < jarakMin) { jarakMin = d; idxTerdekat = i; }
  }

  const TOLERANSI = 55;

  if (jarakMin > TOLERANSI) {
    if (!isOffRoute) {
      isOffRoute = true;
      showToast('Anda keluar jalur. Menghitung rute baru...');
      hitungRuteTomTom(true); 
    }
  } else {
    isOffRoute = false;
    gambarRuteNeonTomTom(idxTerdekat);
    updateInfoJarakDariIdx(idxTerdekat);
    updateInstruksi(idxTerdekat);
  }
}

async function hitungRuteTomTom(force) {
  if (!posisiSaya || !titikTujuan) return;
  if (calcInProgress) return;

  const now = Date.now();
  if (!force && now - lastRuteCalc < 5000) return; 
  lastRuteCalc = now;
  calcInProgress = true;

  // TomTom Routing API (Koordinat formatnya: Lng,Lat;Lng,Lat)
  const url = `https://api.tomtom.com/routing/1/calculateRoute/${posisiSaya.lng},${posisiSaya.lat}:${titikTujuan.lng},${titikTujuan.lat}/json?key=${TOMTOM_API_KEY}&traffic=true&instructionsType=text`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.routes && data.routes.length > 0) {
      ruteData = data.routes[0];
      
      // Ambil titik-titik koordinat rute dari TomTom
      const points = ruteData.legs[0].points;
      ruteAsli = points.map(p => ({ lat: p.latitude, lng: p.longitude }));
      
      instruksiTerakhir = ""; 
      belokan200SudahBerbunyi = false;
      belokan50SudahBerbunyi = false;
      isOffRoute = false; 
      
      gambarRuteNeonTomTom(0);
      updateInfoJarakDariIdx(0);
      updateInstruksi(0);
    } else {
      showToast('Gagal menghitung rute TomTom.');
    }
  } catch (err) {
    console.error('Route error:', err);
    showToast('Koneksi rute gagal. Periksa internet.');
  } finally {
    calcInProgress = false;
  }
}

// ================= GAMBAR GARIS NEON (TOMTOM) =================
function gambarRuteNeonTomTom(idxTerdekat) {
  if (!ruteAsli.length) return;
  
  // Hapus layer lama (TomTom menggunakan map.removeLayer)
  if (rutePolylineGlow) map.removeLayer(rutePolylineGlow);
  if (rutePolylineCore) map.removeLayer(rutePolylineCore);
  if (rutePolylineLewat) map.removeLayer(rutePolylineLewat);

  const pathLewat = ruteAsli.slice(0, idxTerdekat + 1).map(p => [p.lng, p.lat]);
  const pathSisa = ruteAsli.slice(idxTerdekat).map(p => [p.lng, p.lat]);

  // 1. Garis Redup (Sudah dilalui)
  if (pathLewat.length > 1) {
    rutePolylineLewat = new tt.LineString(pathLewat);
    
    // Buat layer garis redup
    rutePolylineLewat = new tt.Layer();
    // CATATAN: TomTom SDK menggunakan style bawaan, tapi kita bisa gunakan addTo(map) dengan Polyline custom jika perlu.
    // Karena SDK TomTom sedikit berbeda untuk styling bebas, kita gunakan trik canvas/SVG manual atau gunakan garis bawaan.
    // Di bawah ini adalah cara termudah menambahkan garis via plugin garis TomTom.
  }

  // Karena TomTom membutuhkan styling custom yang lebih rumit untuk efek Glow (Neon),
  // kita gunakan plugin pihak ketiga atau gambar manual menggunakan SVG Canvas.
  // Namun, untuk kesederhanaan, kita bisa membuat elemen SVG di atas peta TomTom.
  
  const svgOverlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svgOverlay.style.position = "absolute";
  svgOverlay.style.top = 0;
  svgOverlay.style.left = 0;
  svgOverlay.style.width = "100%";
  svgOverlay.style.height = "100%";
  svgOverlay.style.pointerEvents = "none";
  svgOverlay.style.zIndex = 500;

  // Hapus SVG lama jika ada
  const oldSvg = document.getElementById('customRouteSvg');
  if (oldSvg) oldSvg.remove();
  svgOverlay.id = 'customRouteSvg';
  document.getElementById('map').appendChild(svgOverlay);

  // Fungsi untuk menggambar path SVG
  function drawPath(coords, color, weight, opacity) {
    if (coords.length < 2) return;
    let pathData = "";
    
    coords.forEach((coord, index) => {
      const pt = map.project([coord.lng, coord.lat]);
      if (index === 0) pathData += `M ${pt.x} ${pt.y} `;
      else pathData += `L ${pt.x} ${pt.y} `;
    });

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", pathData);
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", weight);
    path.setAttribute("stroke-opacity", opacity);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svgOverlay.appendChild(path);
  }

  // Gambar rute redup
  if (pathLewat.length > 1) {
    drawPath(ruteAsli.slice(0, idxTerdekat + 1), '#8b5cf6', 6, 0.4);
  }

  // Gambar rute neon (Glow Bawah)
  if (pathSisa.length > 1) {
    drawPath(ruteAsli.slice(idxTerdekat), '#7c3aed', 12, 0.8);
    // Gambar rute neon (Inti Putih)
    drawPath(ruteAsli.slice(idxTerdekat), '#ffffff', 3, 1.0);
  }
}

// Panggil ulang gambar SVG setiap kali peta digeser/di-zoom agar garis tetap menempel
map.on('move', () => {
  if (ruteAsli.length > 0) {
    // Cari index terdekat terakhir (bisa disimpan di variabel global)

  }
});

// ================= INFO & INSTRUKSI =================
function updateInfoJarakDariIdx(idxTerdekat) {
  if (!ruteData || !ruteAsli.length) return;

  // TomTom sudah menghitung jarak dan waktu, kita tinggal mengambilnya
  // Tapi untuk sisa jarak dinamis, kita hitung manual
  let sisa = 0;
  for (let i = idxTerdekat; i < ruteAsli.length - 1; i++) {
    sisa += jarakMeter(ruteAsli[i].lat, ruteAsli[i].lng, ruteAsli[i + 1].lat, ruteAsli[i + 1].lng);
  }

  document.getElementById('sisaJarak').textContent = formatJarak(sisa);
  
  // Estimasi waktu berdasarkan kecepatan 30km/jam
  const detikSisa = sisa / (30000 / 3600); 
  const menitSisa = Math.round(detikSisa / 60);
  
  let teksWaktu = menitSisa < 60 ? menitSisa + ' mnt' : Math.floor(menitSisa / 60) + ' j ' + (menitSisa % 60) + ' m';
  document.getElementById('estimasiWaktu').textContent = teksWaktu;

  const waktuTiba = new Date(Date.now() + detikSisa * 1000);
  document.getElementById('jamTiba').textContent = waktuTiba.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
}

function updateInstruksi(idxTerdekat) {
  if (!ruteData || !ruteData.guidance || !ruteData.guidance.instructions) return;
  const instructions = ruteData.guidance.instructions;
  if (!instructions || !instructions.length) return;

  let jarakKeIdx = 0;
  for (let i = 0; i < idxTerdekat; i++) {
    jarakKeIdx += jarakMeter(ruteAsli[i].lat, ruteAsli[i].lng, ruteAsli[i + 1].lat, ruteAsli[i + 1].lng);
  }

  // TomTom memberikan instruksi dengan routeOffsetInMeters
  let currentInstruction = instructions[0];
  for (let i = 0; i < instructions.length; i++) {
    if (instructions[i].routeOffsetInMeters <= jarakKeIdx) {
      currentInstruction = instructions[i];
    } else {
      break;
    }
  }

  const distToNextTurn = currentInstruction.routeOffsetInMeters - jarakKeIdx;
  
  // TomTom menggunakan maneuver (string) untuk tipe belokan
  const maneuver = currentInstruction.maneuver || '';
  let icon = '⬆️', text = 'Lurus';

  // Terjemahan maneuver TomTom ke Bahasa Indonesia
  if (maneuver.includes('TURN_LEFT')) { icon = '⬅️'; text = 'Belok Kiri'; }
  else if (maneuver.includes('TURN_RIGHT')) { icon = '➡️'; text = 'Belok Kanan'; }
  else if (maneuver.includes('TURN_SLIGHT_LEFT')) { icon = '↖️'; text = 'Agak Kiri'; }
  else if (maneuver.includes('TURN_SLIGHT_RIGHT')) { icon = '↗️'; text = 'Agak Kanan'; }
  else if (maneuver.includes('UTURN')) { icon = '🔄'; text = 'Putar Balik'; }
  else if (maneuver.includes('ROUNDABOUT')) { icon = '🔄'; text = 'Bundaran'; }
  else if (maneuver.includes('ARRIVE')) { icon = '🏁'; text = 'Tiba di Tujuan'; }

  document.getElementById('turnIcon').textContent = icon;
  document.getElementById('turnText').textContent = text;
  document.getElementById('turnDist').textContent = distToNextTurn > 0 ? formatJarak(distToNextTurn) + ' lagi' : 'Segera';

  // ================= LOGIKA SUARA =================
  const isTurnInstruction = (text.includes('Kiri') || text.includes('Kanan') || text.includes('Balik') || text.includes('Bundaran'));

  if (isTurnInstruction) {
    if (distToNextTurn <= 210 && distToNextTurn > 190 && !belokan200SudahBerbunyi) {
      putarSuara(`Dalam 200 meter, ${text} sayang`);
      belokan200SudahBerbunyi = true;
    }
    
    if (distToNextTurn <= 60 && distToNextTurn > 40 && !belokan50SudahBerbunyi) {
      putarSuara(`Dalam 50 meter, ${text} sayang`);
      belokan50SudahBerbunyi = true;
    }
  }

  if (text !== instruksiTerakhir) {
    instruksiTerakhir = text;
    belokan200SudahBerbunyi = false;
    belokan50SudahBerbunyi = false;
  }
}

// ================= UTIL JARAK =================
function jarakMeter(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatJarak(meter) {
  if (meter < 1000) return Math.round(meter) + ' m';
  return (meter / 1000).toFixed(1) + ' km';
}
