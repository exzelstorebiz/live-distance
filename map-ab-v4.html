.marker-a,

<body>

<div class="header">
  <h1>NAVIGASI LIVE</h1>
  <p>A + SAYA + B</p>
</div>

<div class="container">

  <div class="map-box">
    <div id="map"></div>
  </div>

<button
  type="button"
  onclick="kembaliKePosisiSaya()"
  style="
    display: block;
    width: 100%;
    margin-top: 8px;

    border: none;
    border-radius: 10px;

    font-weight: 600;

  "
>
  📍 KEMBALI KE POSISI SAYA
</button>
  
  <div class="card">

    <div class="status">

>

>

      <div class="section-title s-title">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;

let posisiSaya = null;
let titikA = null;
let titikB = null;

let markerSaya = null;
let markerA = null;
let markerB = null;

let circleAkurasi = null;
let garisRute = null;
let ruteTujuan = null;

let ruteSudahDilalui = null;
let ruteBelumDilalui = null;

let jarakRuteTotal = null;
let jarakRuteSisa = null;
let ikutiPosisiSaya = true;

  function kembaliKePosisiSaya() {

  if (!posisiSaya) {
    return;
  }

  ikutiPosisiSaya = true;

  map.setView(
    [posisiSaya.lat, posisiSaya.lon],
    map.getZoom(),
    {
      animate: true
    }
  );
}
  
function buatIcon(className, text) {
  return L.divIcon({
    className: "",
    html: '<div class="' + className + '">' + text + '</div>',
    iconSize: [42, 42],
    iconAnchor: [21, 21]
  });
}

const iconA = buatIcon("marker-a", "A");
const iconS = buatIcon("marker-s", "S");
const iconB = buatIcon("marker-b", "B");

map = L.map("map").setView(
  [-6.387, 106.936],
  16
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

function aktifkanGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsStatus").textContent =
      "GPS TIDAK DIDUKUNG";

    return;
  }

  document.getElementById("gpsStatus").textContent =
    "MENCARI POSISI...";

  navigator.geolocation.watchPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      posisiSaya = {
        lat: lat,
        lon: lon,
        accuracy: accuracy
      };

      document.getElementById("gpsStatus").textContent =
        "GPS AKTIF";

      document.getElementById("latitude").textContent =
        lat.toFixed(7);

      document.getElementById("longitude").textContent =
        lon.toFixed(7);

      document.getElementById("accuracy").textContent =
        "± " + Math.round(accuracy) + " meter";

      document.getElementById("updateTime").textContent =
        new Date().toLocaleTimeString("id-ID");


      /* =========================
         MARKER SAYA
         ========================= */

      if (!markerSaya) {

        markerSaya =
          L.marker(
            [lat, lon],
            { icon: iconS }
          ).addTo(map);

        markerSaya.bindPopup(
          "<b>SAYA</b><br>Posisi GPS saat ini"
        );

        map.setView(
          [lat, lon],
          17
        );

      } else {

        markerSaya.setLatLng(
          [lat, lon]
        );

        /* MAP MENGIKUTI POSISI SAYA */


  map.setView(
    [lat, lon],
    map.getZoom(),
    {
      animate: false
    }
  );




      /* =========================
         LINGKARAN AKURASI GPS
         ========================= */

      if (!circleAkurasi) {

        circleAkurasi =
          L.circle(
            [lat, lon],
            {
              radius: accuracy,
              color: "#7138e8",
              fillColor: "#7138e8",
              fillOpacity: 0.12,
              weight: 2
            }
          ).addTo(map);

      } else {

        circleAkurasi.setLatLng(
          [lat, lon]
        );

        circleAkurasi.setRadius(
          accuracy
        );
      }


      /* =========================
         PERBARUI JARAK
         ========================= */

      perbaruiJarak();
      perbaruiWarnaRute();

    },

    function(error) {

      document.getElementById("gpsStatus").textContent =
        "GPS ERROR";

      console.log(error);

    },

    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 10000
    }

  );
}

function jadikanA() {

  if (!posisiSaya) {

    alert(
      "Posisi GPS belum tersedia."
    );

    return;
  }

  titikA = {
    lat: posisiSaya.lat,
    lon: posisiSaya.lon
  };

  if (markerA) {
    map.removeLayer(markerA);
  }

  markerA = L.marker(
    [titikA.lat, titikA.lon],
    { icon: iconA }
  ).addTo(map);

  markerA.bindPopup(
    "<b>TITIK A</b><br>Titik Awal"
  );

  tampilkanA();

  perbaruiJarak();

  tampilkanSemuaTitik();
}

function jadikanB() {

  if (!posisiSaya) {

    alert(
      "Posisi GPS belum tersedia."
    );

    return;
  }

  titikB = {
    lat: posisiSaya.lat,
    lon: posisiSaya.lon
  };

  if (markerB) {
    map.removeLayer(markerB);
  }

  markerB = L.marker(
    [titikB.lat, titikB.lon],
    { icon: iconB }
  ).addTo(map);

  markerB.bindPopup(
    "<b>TITIK B</b><br>Tujuan"
  );

  tampilkanB();

  perbaruiJarak();

  tampilkanSemuaTitik();
}

let modePilihB = false;

function aktifkanPilihB() {

  modePilihB = true;

  document.getElementById("gpsStatus").textContent =
    "PILIH TUJUAN DI PETA";

  alert(
    "Silakan ketuk lokasi yang ingin dijadikan TUJUAN B pada peta."
  );
}

  function pilihBTitik(e) {

  if (!modePilihB) {
    return;
  }

  titikB = {
    lat: e.latlng.lat,
    lon: e.latlng.lng
  };

  if (markerB) {
    map.removeLayer(markerB);
    markerB = null;
  }

  markerB = L.marker(
    [titikB.lat, titikB.lon],
    { icon: iconB }
  ).addTo(map);

  markerB.bindPopup(
    "<b>TITIK B</b><br>Tujuan"
  );

  tampilkanB();
  perbaruiJarak();
  hitungRuteKeB();
  tampilkanSemuaTitik();
    
  modePilihB = false;

  document.getElementById("gpsStatus").textContent =
    "GPS AKTIF";
}
  map.on("click", pilihBTitik);
  map.on("dragstart", function() {

  ikutiPosisiSaya = false;

});
  
function tampilkanA() {

  document.getElementById("aCoordinate").textContent =
    "Lat: " +
    titikA.lat.toFixed(7) +
    " | Lon: " +
    titikA.lon.toFixed(7);
}

function tampilkanB() {

  document.getElementById("bCoordinate").textContent =
    "Lat: " +
    titikB.lat.toFixed(7) +
    " | Lon: " +
    titikB.lon.toFixed(7);
}
async function cariAlamatTujuan() {

  const input =
    document.getElementById("alamatTujuan");

  const alamat =
    input.value.trim();

  if (!alamat) {

    alert(
      "Silakan ketik alamat tujuan terlebih dahulu."
    );

    return;
  }

  const tombol =
    document.getElementById("btnCariTujuan");

  tombol.disabled = true;
  tombol.textContent = "🔎 MENCARI...";

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?q=" +
      encodeURIComponent(alamat) +
      "&format=jsonv2" +
      "&limit=1" +
      "&countrycodes=id";

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error(
        "Gagal menghubungi layanan pencarian."
      );
    }

    const hasil =
      await response.json();

    if (!hasil.length) {

      alert(
        "Alamat tujuan tidak ditemukan."
      );

      return;
    }

    const lokasi =
      hasil[0];

    titikB = {
      lat: parseFloat(lokasi.lat),
      lon: parseFloat(lokasi.lon)
    };

    if (markerB) {
      map.removeLayer(markerB);
      markerB = null;
    }

    markerB =
      L.marker(
        [titikB.lat, titikB.lon],
        { icon: iconB }
      ).addTo(map);

    markerB.bindPopup(
      "<b>TITIK B</b><br>" +
      (lokasi.display_name || "Tujuan")
    );

    tampilkanB();

perbaruiJarak();

hitungRuteKeB();

map.setView(
  [titikB.lat, titikB.lon],
  17
);

  } catch (error) {

    console.error(
      "Gagal mencari alamat:",
      error
    );

    alert(
      "Pencarian alamat gagal. Silakan coba lagi."
    );

  } finally {

    tombol.disabled = false;
    tombol.textContent = "🔎 CARI TUJUAN";
  }
}
  
function jarakMeter(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const deltaLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const deltaLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(deltaLat / 2) *
    Math.sin(deltaLat / 2) +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(deltaLon / 2) *
    Math.sin(deltaLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}

function formatJarak(meter) {

  if (meter < 1000) {

    return Math.round(meter) + " meter";

  }

  return (
    (meter / 1000)
      .toFixed(2)
      .replace(".", ",")
    + " km"
  );
}

function perbaruiJarak() {

  if (
    titikA &&
    posisiSaya
  ) {

    const dAS =
      jarakMeter(
        titikA.lat,
        titikA.lon,
        posisiSaya.lat,
        posisiSaya.lon
      );

    document.getElementById("distanceAS")
      .textContent =
      formatJarak(dAS);
  }

  if (
    posisiSaya &&
    titikB
  ) {

    const dSB =
      jarakMeter(
        posisiSaya.lat,
        posisiSaya.lon,
        titikB.lat,
        titikB.lon
      );

    document.getElementById("distanceSB")
      .textContent =
      formatJarak(dSB);
  }

    if (
    titikA &&
    titikB
  ) {

    const dAB =
      jarakMeter(
        titikA.lat,
        titikA.lon,
        titikB.lat,
        titikB.lon
      );

    document.getElementById("distanceAB")
      .textContent =
      formatJarak(dAB);
  }
}

  function perbaruiGarisRute() {

  if (garisRute) {
    map.removeLayer(garisRute);
    garisRute = null;
  }

  const jalur = [];

  if (titikA) {
    jalur.push([
      titikA.lat,
      titikA.lon
    ]);
  }

  if (posisiSaya) {
    jalur.push([
      posisiSaya.lat,
      posisiSaya.lon
    ]);
  }

  if (titikB) {
    jalur.push([
      titikB.lat,
      titikB.lon
    ]);
  }

  if (jalur.length >= 2) {

    garisRute = L.polyline(
      jalur,
      {
        color: "#7B2FF7",
        weight: 5,
        opacity: 0.85,
        lineCap: "round",
        lineJoin: "round"
      }
    ).addTo(map);
  }
}

  async function hitungRuteKeB() {

  if (!posisiSaya || !titikB) {
    return;
  }

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    posisiSaya.lon + "," +
    posisiSaya.lat + ";" +
    titikB.lon + "," +
    titikB.lat +
    "?overview=full&geometries=geojson";

  try {

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (
      !data.routes ||
      !data.routes.length
    ) {
      return;
    }

jarakRuteTotal =
  data.routes[0].distance;

    tampilkanJarakRute();
    
    if (garisRute) {
  map.removeLayer(garisRute);
  garisRute = null;
}
    
    if (ruteTujuan) {
      map.removeLayer(ruteTujuan);
      ruteTujuan = null;
    }

    ruteTujuan =
      L.geoJSON(
        data.routes[0].geometry,
        {
          style: {
            color: "#7B2FF7",
            weight: 6,
            opacity: 0.9,
            lineCap: "round",
            lineJoin: "round"
          }
        }
      ).addTo(map);

  } catch (error) {

    console.error(
      "Gagal menghitung rute:",
      error
    );
  }
}

  function perbaruiWarnaRute() {

  if (!posisiSaya || !ruteTujuan) {
    return;
  }

  const layers =
    ruteTujuan.getLayers();

  if (
    !layers.length ||
    !layers[0].getLatLngs
  ) {
    return;
  }

  const titikRute =
    layers[0].getLatLngs();

  if (!titikRute.length) {
    return;
  }

  let indeksTerdekat = 0;
  let jarakTerdekat = Infinity;

  for (
    let i = 0;
    i < titikRute.length;
    i++
  ) {

    const jarak =
      jarakMeter(
        posisiSaya.lat,
        posisiSaya.lon,
        titikRute[i].lat,
        titikRute[i].lng
      );

    if (jarak < jarakTerdekat) {

      jarakTerdekat = jarak;
      indeksTerdekat = i;
    }
  }

  const jalurDilalui = [];
  const jalurTujuan = [];

  for (
    let i = 0;
    i <= indeksTerdekat;
    i++
  ) {

    jalurDilalui.push([
      titikRute[i].lat,
      titikRute[i].lng
    ]);
  }

  jalurDilalui.push([
    posisiSaya.lat,
    posisiSaya.lon
  ]);

  jalurTujuan.push([
    posisiSaya.lat,
    posisiSaya.lon
  ]);

  for (
    let i = indeksTerdekat + 1;
    i < titikRute.length;
    i++
  ) {

    jalurTujuan.push([
      titikRute[i].lat,
      titikRute[i].lng
    ]);
  }

  if (ruteSudahDilalui) {
    map.removeLayer(ruteSudahDilalui);
    ruteSudahDilalui = null;
  }

  if (ruteBelumDilalui) {
    map.removeLayer(ruteBelumDilalui);
    ruteBelumDilalui = null;
  }

  if (jalurDilalui.length >= 2) {

    ruteSudahDilalui =
      L.polyline(
        jalurDilalui,
        {
          color: "#FF8A00",
          weight: 6,
          opacity: 0.95,
          lineCap: "round",
          lineJoin: "round"
        }
      ).addTo(map);
  }

  if (jalurTujuan.length >= 2) {

    ruteBelumDilalui =
      L.polyline(
        jalurTujuan,
        {
          color: "#7B2FF7",
          weight: 6,
          opacity: 0.95,
          lineCap: "round",
          lineJoin: "round"
        }
      ).addTo(map);
  }
}

  function tampilkanJarakRute() {

  if (jarakRuteTotal === null) {
    return;
  }

  const elemen =
    document.getElementById("distanceAB");

  if (!elemen) {
    return;
  }

  elemen.textContent =
    formatJarak(jarakRuteTotal);
}
  
  let garisLive = null;

function perbaruiGarisLive() {

  const jalur = [];

  if (titikA) {
    jalur.push([
      titikA.lat,
      titikA.lon
    ]);
  }

  if (posisiSaya) {
    jalur.push([
      posisiSaya.lat,
      posisiSaya.lon
    ]);
  }

  if (titikB) {
    jalur.push([
      titikB.lat,
      titikB.lon
    ]);
  }

  if (garisLive) {
    map.removeLayer(garisLive);
    garisLive = null;
  }

  if (jalur.length >= 2) {

    garisLive = L.polyline(
      jalur,
      {
        color: "#7B2FE2",
        weight: 5,
        opacity: 0.85
      }
    ).addTo(map);
  }
}
  
function tampilkanSemuaTitik() {

  const titik = [];

  if (titikA) {
    titik.push(
      [titikA.lat, titikA.lon]
    );
  }

  if (posisiSaya) {
    titik.push(
      [posisiSaya.lat, posisiSaya.lon]
    );
  }

  if (titikB) {
    titik.push(
      [titikB.lat, titikB.lon]
    );
  }

  if (titik.length >= 2) {

    const bounds =
      L.latLngBounds(titik);

    map.fitBounds(
      bounds,
      {
        padding: [40, 40]
      }
    );
  }
}

function hapusAB() {

  titikA = null;
  titikB = null;

  if (markerA) {
    map.removeLayer(markerA);
    markerA = null;
  }

  if (markerB) {
    map.removeLayer(markerB);
    markerB = null;
  }

  document.getElementById("aCoordinate").textContent =
    "Belum ditentukan";

  document.getElementById("bCoordinate").textContent =
    "Belum ditentukan";

  document.getElementById("distanceAS").textContent =
    "-";

  document.getElementById("distanceSB").textContent =
    "-";

  document.getElementById("distanceAB").textContent =
    "-";
}

aktifkanGPS();
