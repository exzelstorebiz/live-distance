<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAVIGASI LIVE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #f4f3f8; color: #202020; overflow: hidden; }
#map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: #7138e8; color: white; text-align: center; padding: 8px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.header h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
.header p { margin: 2px 0 0; font-size: 11px; opacity: .9; }

/* PANEL BAWAH */
.bottom-panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  background: white; border-radius: 20px 20px 0 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,.15);
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  max-height: 55vh; overflow-y: auto;
  transform: translateY(calc(100% - 130px));
  transition: transform .3s ease;
}
.bottom-panel.open { transform: translateY(0); }
.panel-handle {
  width: 50px; height: 5px; background: #ddd; border-radius: 3px;
  margin: 0 auto 10px; cursor: pointer;
}
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.status {
  flex: 1; background: #f1eaff; color: #5730a8; border-radius: 12px;
  padding: 8px 12px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px;
}
.status-dot { width: 10px; height: 10px; background: #ff8500; border-radius: 50%; flex-shrink: 0; }
.status-dot.ok { background: #18a84b; }

.input-row { display: flex; gap: 6px; margin-bottom: 8px; }
.input-row input {
  flex: 1; padding: 11px 12px; border: 1px solid #ddd; border-radius: 10px;
  font-size: 14px; outline: none;
}
.input-row input:focus { border-color: #7138e8; }
button {
  border: 0; border-radius: 10px; padding: 11px 14px; color: white;
  font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
button:disabled { opacity: .6; }
.btn-primary { background: #7138e8; }
.btn-search { background: #7138e8; }

.info-row { display: flex; gap: 8px; margin-bottom: 8px; }
.info-box {
  flex: 1; background: #fafafa; border-radius: 10px; padding: 8px 10px;
  border-left: 4px solid #7138e8;
}
.info-label { color: #777; font-size: 10px; font-weight: 700; }
.info-value { font-size: 16px; font-weight: 800; margin-top: 2px; }

.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-row button { flex: 1; }

.btn-clear { background: #888; }
.btn-recenter { background: #7138e8; }

/* PANEL ATAS - navigasi info */
.top-info {
  position: fixed; top: 48px; left: 12px; right: 12px; z-index: 999;
  background: rgba(255,255,255,.95); border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.12); padding: 8px 12px;
  display: none;
}
.top-info.show { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top-info .stat { text-align: center; flex: 1; }
.top-info .stat-label { font-size: 10px; color: #888; font-weight: 700; }
.top-info .stat-value { font-size: 17px; font-weight: 800; color: #7138e8; }

/* Tombol kembali ke posisi */
.btn-recenter-float {
  position: fixed; right: 14px; bottom: 150px; z-index: 1001;
  width: 52px; height: 52px; border-radius: 50%;
  background: #7138e8; color: white; border: 3px solid white;
  box-shadow: 0 3px 12px rgba(0,0,0,.3); font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.btn-recenter-float.active { background: #18a84b; }

/* Marker */
.marker-saya {
  width: 28px; height: 28px; border-radius: 50%;
  background: #7138e8; border: 3px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.marker-saya::after {
  content: ''; position: absolute; width: 0; height: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent;
  border-bottom: 10px solid white;
  top: -8px; left: 50%; transform: translateX(-50%);
}
.marker-tujuan {
  width: 36px; height: 36px; border-radius: 50% 50% 50% 0;
  background: #ff8100; border: 3px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  transform: rotate(-45deg);
}
.marker-tujuan::after {
  content: ''; position: absolute; width: 12px; height: 12px;
  background: white; border-radius: 50%; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

/* Instructions box */
.instruction-box {
  position: fixed; top: 90px; left: 12px; right: 12px; z-index: 999;
  background: #1e1e2e; color: white; border-radius: 14px;
  padding: 12px 16px; box-shadow: 0 3px 15px rgba(0,0,0,.25);
  display: none;
}
.instruction-box.show { display: block; }
.instruction-box .turn-icon { font-size: 28px; margin-right: 10px; vertical-align: middle; }
.instruction-box .turn-text { font-size: 16px; font-weight: 700; vertical-align: middle; }
.instruction-box .turn-dist { font-size: 12px; color: #bbb; margin-top: 4px; }

.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; font-weight: 700; color: #555; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-s { background: #7138e8; }
.legend-t { background: #ff8100; }

.toast {
  position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%);
  background: #333; color: white; padding: 10px 18px; border-radius: 20px;
  font-size: 13px; z-index: 2000; opacity: 0; transition: opacity .3s;
  pointer-events: none; max-width: 80%; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="map"></div>

<div class="header">
  <h1>NAVIGASI LIVE</h1>
  <p>Tujuan Perjalanan</p>
</div>

<div class="top-info" id="topInfo">
  <div class="stat">
    <div class="stat-label">SISA JARAK</div>
    <div class="stat-value" id="sisaJarak">-</div>
  </div>
  <div class="stat">
    <div class="stat-label">ESTIMASI</div>
    <div class="stat-value" id="estimasi">-</div>
  </div>
  <div class="stat">
    <div class="stat-label">TOTAL</div>
    <div class="stat-value" id="totalJarak">-</div>
  </div>
</div>

<div class="instruction-box" id="instructionBox">
  <span class="turn-icon" id="turnIcon">⬆️</span>
  <span class="turn-text" id="turnText">Lurus</span>
  <div class="turn-dist" id="turnDist"></div>
</div>

<button class="btn-recenter-float active" id="btnRecenter" onclick="kembaliKePosisiSaya()" title="Kembali ke posisi saya">
  📍
</button>

<div class="bottom-panel" id="bottomPanel">
  <div class="panel-handle" onclick="togglePanel()"></div>

  <div class="row">
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="gpsStatus">MENCARI GPS...</span>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="alamatTujuan" placeholder="Ketik / tempel lokasi tujuan (bisa dari WhatsApp)">
    <button class="btn-search" id="btnCariTujuan" onclick="cariAlamatTujuan()">🔎</button>
  </div>

  <div class="input-row">
    <button class="btn-primary" style="flex:1" onclick="aktifkanPilihTujuan()">🗺️ PILIH DI PETA</button>
    <button class="btn-primary" style="flex:1" onclick="tempelDariClipboard()">📋 TEMPEL LOKASI</button>
  </div>

  <div class="info-row">
    <div class="info-box">
      <div class="info-label">TUJUAN</div>
      <div class="info-value" id="tujuanNama" style="font-size:12px; word-break:break-word;">Belum ditentukan</div>
    </div>
  </div>

  <div class="info-row">
    <div class="info-box">
      <div class="info-label">LATITUDE</div>
      <div class="info-value" id="latitude" style="font-size:13px;">-</div>
    </div>
    <div class="info-box">
      <div class="info-label">LONGITUDE</div>
      <div class="info-value" id="longitude" style="font-size:13px;">-</div>
    </div>
  </div>

  <div class="info-row">
    <div class="info-box">
      <div class="info-label">AKURASI</div>
      <div class="info-value" id="accuracy" style="font-size:14px;">-</div>
    </div>
    <div class="info-box">
      <div class="info-label">UPDATE</div>
      <div class="info-value" id="updateTime" style="font-size:14px;">-</div>
    </div>
  </div>

  <div class="legend">
    <span><i class="legend-dot legend-s"></i> Posisi Saya</span>
    <span><i class="legend-dot legend-t"></i> Tujuan</span>
  </div>

  <div class="btn-row">
    <button class="btn-clear" onclick="hapusTujuan()">🗑️ HAPUS TUJUAN</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============ STATE ============
let map;
let posisiSaya = null;
let titikTujuan = null;
let heading = 0; // arah hadap perangkat (derajat, 0 = utara)
let rotasiPeta = 0; // rotasi map agar perjalanan selalu ke atas
let followMode = true; // posisi saya selalu di tengah
let modePilihTujuan = false;

let markerSaya = null;
let markerTujuan = null;
let circleAkurasi = null;
let ruteLayer = null;
let ruteData = null; // data route dari OSRM
let ruteCoordinates = []; // array {lat,lng}

let watchId = null;
let lastRuteCalc = null;

// ============ MAP INIT ============
map = L.map("map", {
  zoomControl: false,
  attributionControl: false,
  rotate: true,
  touchRotate: false,
  rotateControl: false
}).setView([-6.387, 106.936], 17);

// plugin rotate tidak ada di CDN standar, kita pakai CSS transform manual
// fallback: gunakan layer pane rotation via CSS
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19
}).addTo(map);

// ============ ICONS ============
const iconSaya = L.divIcon({
  className: "",
  html: '<div class="marker-saya"></div>',
  iconSize: [28, 28],
  iconAnchor: [14, 14]
});

const iconTujuan = L.divIcon({
  className: "",
  html: '<div class="marker-tujuan"></div>',
  iconSize: [36, 36],
  iconAnchor: [18, 36]
});

// ============ TOAST ============
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

// ============ PANEL TOGGLE ============
function togglePanel() {
  document.getElementById('bottomPanel').classList.toggle('open');
}

// ============ GPS ============
function mulaiGPS() {
  if (!navigator.geolocation) {
    setStatus('GPS TIDAK DIDUKUNG', false);
    return;
  }
  setStatus('MENCARI POSISI...', false);
  watchId = navigator.geolocation.watchPosition(
    onPosition,
    onPositionError,
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
  );
}

function setStatus(text, ok) {
  document.getElementById('gpsStatus').textContent = text;
  document.getElementById('statusDot').classList.toggle('ok', ok);
}

function onPosition(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const acc = position.coords.accuracy;

  posisiSaya = { lat, lon, accuracy: acc };
  setStatus('GPS AKTIF', true);

  document.getElementById('latitude').textContent = lat.toFixed(7);
  document.getElementById('longitude').textContent = lon.toFixed(7);
  document.getElementById('accuracy').textContent = '± ' + Math.round(acc) + ' m';
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('id-ID');

  // marker saya
  if (!markerSaya) {
    markerSaya = L.marker([lat, lon], { icon: iconSaya, zIndexOffset: 1000 }).addTo(map);
  } else {
    markerSaya.setLatLng([lat, lon]);
  }

  // circle akurasi
  if (!circleAkurasi) {
    circleAkurasi = L.circle([lat, lon], {
      radius: acc, color: '#7138e8', fillColor: '#7138e8',
      fillOpacity: 0.1, weight: 1
    }).addTo(map);
  } else {
    circleAkurasi.setLatLng([lat, lon]);
    circleAkurasi.setRadius(acc);
  }

  // hitung heading dari gerakan (jika ada posisi sebelumnya)
  updateHeading(lat, lon);

  // update rute
  perbaruiRute();

  // posisi selalu di tengah jika follow mode
  if (followMode) {
    centerOnMe();
  }
}

function onPositionError(err) {
  console.warn(err);
  setStatus('GPS ERROR', false);
}

// ============ HEADING DARI GERAKAN ============
let lastPosForHeading = null;
let lastHeadingTime = 0;

function updateHeading(lat, lon) {
  const now = Date.now();
  if (lastPosForHeading && now - lastHeadingTime > 800) {
    const dLat = lat - lastPosForHeading.lat;
    const dLon = lon - lastPosForHeading.lon;
    const dist = Math.sqrt(dLat * dLat + dLon * dLon);
    // hanya update heading jika bergerak cukup jauh (> 3 meter)
    if (dist > 0.00003) {
      const bearing = Math.atan2(dLon * Math.cos(lat * Math.PI / 180), dLat) * 180 / Math.PI;
      heading = (bearing + 360) % 360;
      lastPosForHeading = { lat, lon };
      lastHeadingTime = now;
      if (followMode && ruteCoordinates.length > 0) {
        centerOnMe();
      }
    }
  } else if (!lastPosForHeading) {
    lastPosForHeading = { lat, lon };
    lastHeadingTime = now;
  }
}

// ============ ROTASI PETA ============
// Peta diputar agar arah perjalanan (heading) selalu ke atas.
// Karena Leaflet tidak support rotate, kita pakai CSS transform pada map container
// dengan pendekatan: container dirotate, lalu di-counter-rotate marker/label.
// Namun CSS rotate akan memutar semua overlay termasuk marker.
// Solusi: gunakan div khusus yang dirotasi dan marker di-counter-rotate.

// Untuk simplisitas dan stabilitas, kita gunakan pendekatan:
// - Rotasi hanya pada map pane (tile layer) menggunakan transform
// - Marker diposisikan ulang setiap rotasi via CSS counter-rotate

let mapPaneRotated = null;

function applyRotation(deg) {
  // Rotasi diterapkan ke container tile pane via CSS
  // Kita gunakan properti transform pada .leaflet-map-pane
  const pane = map.getPanes().mapPane;
  if (!pane) return;
  // Simpan rotasi
  rotasiPeta = deg;
  // Counter-rotate markers
  const markerPane = map.getPanes().markerPane;
  const shadowPane = map.getPanes().shadowPane;
  const overlayPane = map.getPanes().overlayPane;

  // Rotasi semua pane kecuali marker (marker akan di-counter)
  // Sebenarnya paling mudah: rotasi seluruh map-pane, lalu counter-rotate marker
  pane.style.transform = `rotate(${-deg}deg)`;
  pane.style.transformOrigin = 'center center';

  if (markerPane) {
    markerPane.style.transform = `rotate(${deg}deg)`;
    markerPane.style.transformOrigin = 'center center';
  }
  if (shadowPane) {
    shadowPane.style.transform = `rotate(${deg}deg)`;
    shadowPane.style.transformOrigin = 'center center';
  }
}

function centerOnMe() {
  if (!posisiSaya) return;
  const target = map.getZoom();
  // Rotasi berdasarkan heading
  const rotDeg = heading;
  applyRotation(rotDeg);
  map.setView([posisiSaya.lat, posisiSaya.lon], target, { animate: false });
  document.getElementById('btnRecenter').classList.add('active');
}

function kembaliKePosisiSaya() {
  followMode = true;
  document.getElementById('btnRecenter').classList.add('active');
  if (posisiSaya) {
    centerOnMe();
  } else {
    showToast('Posisi GPS belum tersedia');
  }
}

// saat map digeser manual -> follow mode off
map.on('dragstart', function() {
  followMode = false;
  document.getElementById('btnRecenter').classList.remove('active');
});

// ============ CARI ALAMAT ============
async function cariAlamatTujuan() {
  const input = document.getElementById('alamatTujuan');
  const raw = input.value.trim();
  if (!raw) {
    showToast('Ketik alamat atau tempel link lokasi');
    return;
  }

  const btn = document.getElementById('btnCariTujuan');
  btn.disabled = true;
  btn.textContent = '⏳';

  try {
    // deteksi koordinat / link share
    const parsed = parseShareLocation(raw);
    if (parsed) {
      setTujuan(parsed.lat, parsed.lon, 'Lokasi dari share');
      btn.disabled = false;
      btn.textContent = '🔎';
      return;
    }

    // deteksi Google Maps link -> coba ekstrak
    if (raw.includes('google.com/maps') || raw.includes('goo.gl/maps') || raw.includes('maps.app.goo.gl')) {
      const extracted = await resolveGoogleMapsLink(raw);
      if (extracted) {
        setTujuan(extracted.lat, extracted.lon, 'Lokasi dari Google Maps');
        btn.disabled = false;
        btn.textContent = '🔎';
        return;
      }
    }

    // nominatim search
    const url = 'https://nominatim.openstreetmap.org/search?q=' +
      encodeURIComponent(raw) + '&format=jsonv2&limit=1&countrycodes=id';
    const res = await fetch(url, { headers: { 'Accept-Language': 'id' } });
    const data = await res.json();
    if (!data.length) {
      showToast('Lokasi tidak ditemukan');
      return;
    }
    const loc = data[0];
    setTujuan(parseFloat(loc.lat), parseFloat(loc.lon), loc.display_name || 'Tujuan');
  } catch (err) {
    console.error(err);
    showToast('Pencarian gagal, coba lagi');
  } finally {
    btn.disabled = false;
    btn.textContent = '🔎';
  }
}

// parse berbagai format share lokasi
function parseShareLocation(text) {
  // format: "lat, lon" atau "lat lon"
  let m = text.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if (m) {
    const a = parseFloat(m[1]);
    const b = parseFloat(m[2]);
    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) {
      return { lat: a, lon: b };
    }
  }
  // format: "geo:lat,lon" atau "?q=lat,lon"
  m = text.match(/(?:q|query|ll|center)=(-?\d+\.\d+)[,%20]+(-?\d+\.\d+)/);
  if (m) {
    return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
  }
  // format: koordinat dalam URL @lat,lon
  m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) {
    return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
  }
  return null;
}

// resolve google maps short link via fetch (CORS mungkin gagal, fallback null)
async function resolveGoogleMapsLink(url) {
  try {
    // coba fetch redirect - sering CORS block, jadi ini best-effort
    const res = await fetch(url, { redirect: 'follow', mode: 'cors' });
    const finalUrl = res.url || url;
    const m = finalUrl.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              finalUrl.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              finalUrl.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
  } catch (e) {
    // CORS gagal, coba buka via link - user manual
  }
  return null;
}

// tempel dari clipboard (untuk share WhatsApp)
async function tempelDariClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      showToast('Clipboard kosong');
      return;
    }
    document.getElementById('alamatTujuan').value = text;
    // otomatis cari
    cariAlamatTujuan();
  } catch (err) {
    showToast('Tidak bisa akses clipboard. Tempel manual di kolom.');
  }
}

// ============ SET TUJUAN ============
function setTujuan(lat, lon, nama) {
  titikTujuan = { lat, lon, nama: nama || 'Tujuan' };

  if (markerTujuan) map.removeLayer(markerTujuan);
  markerTujuan = L.marker([lat, lon], { icon: iconTujuan }).addTo(map);

  document.getElementById('tujuanNama').textContent = nama || (lat.toFixed(5) + ', ' + lon.toFixed(5));
  document.getElementById('topInfo').classList.add('show');
  document.getElementById('instructionBox').classList.add('show');

  // hitung rute
  hitungRute();

  // zoom ke tujuan sebentar lalu kembali ke saya
  if (posisiSaya) {
    const bounds = L.latLngBounds([[posisiSaya.lat, posisiSaya.lon], [lat, lon]]);
    map.fitBounds(bounds, { padding: [60, 60] });
    setTimeout(() => {
      followMode = true;
      centerOnMe();
    }, 1500);
  }
}

// ============ PILIH TUJUAN DI PETA ============
function aktifkanPilihTujuan() {
  modePilihTujuan = true;
  setStatus('KETUK PETA UNTUK TUJUAN', false);
  showToast('Ketuk lokasi tujuan di peta', 3000);
  document.getElementById('bottomPanel').classList.remove('open');
}

map.on('click', function(e) {
  if (!modePilihTujuan) return;
  modePilihTujuan = false;
  setTujuan(e.latlng.lat, e.latlng.lng, 'Titik dipilih di peta');
  setStatus('GPS AKTIF', true);
});

// ============ HITUNG RUTE (OSRM) ============
let lastCalcTime = 0;
let calcInProgress = false;

async function hitungRute() {
  if (!posisiSaya || !titikTujuan) return;
  if (calcInProgress) return;

  const now = Date.now();
  if (lastRuteCalc && now - lastRuteCalc < 5000) return; // throttle 5 detik
  lastRuteCalc = now;
  calcInProgress = true;

  const url = 'https://router.project-osrm.org/route/v1/driving/' +
    posisiSaya.lon + ',' + posisiSaya.lat + ';' +
    titikTujuan.lon + ',' + titikTujuan.lat +
    '?overview=full&geometries=geojson&steps=true';

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.routes || !data.routes.length) return;

    ruteData = data.routes[0];
    ruteCoordinates = ruteData.geometry.coordinates.map(c => ({ lat: c[1], lon: c[0] }));

    tampilkanRute();
    updateInfoJarak();
    updateInstruksi();
  } catch (err) {
    console.error('Route error:', err);
  } finally {
    calcInProgress = false;
  }
}

function perbaruiRute() {
  // dipanggil tiap update GPS
  if (titikTujuan && posisiSaya) {
    hitungRute();
    if (ruteCoordinates.length > 0) {
      updateInfoJarak();
      updateInstruksi();
    }
  }
}

function tampilkanRute() {
  if (ruteLayer) map.removeLayer(ruteLayer);
  if (!ruteCoordinates.length) return;

  const latlngs = ruteCoordinates.map(c => [c.lat, c.lon]);
  ruteLayer = L.polyline(latlngs, {
    color: '#7138e8',
    weight: 7,
    opacity: 0.85,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);
}

// ============ INFO JARAK & INSTRUKSI ============
function updateInfoJarak() {
  if (!posisiSaya || !ruteData) return;

  // cari titik terdekat pada rute
  let idxTerdekat = 0;
  let jarakMin = Infinity;
  for (let i = 0; i < ruteCoordinates.length; i++) {
    const d = jarakMeter(posisiSaya.lat, posisiSaya.lon, ruteCoordinates[i].lat, ruteCoordinates[i].lon);
    if (d < jarakMin) { jarakMin = d; idxTerdekat = i; }
  }

  // hitung sisa jarak dari titik terdekat
  let sisa = 0;
  for (let i = idxTerdekat; i < ruteCoordinates.length - 1; i++) {
    sisa += jarakMeter(
      ruteCoordinates[i].lat, ruteCoordinates[i].lon,
      ruteCoordinates[i + 1].lat, ruteCoordinates[i + 1].lon
    );
  }

  document.getElementById('sisaJarak').textContent = formatJarak(sisa);
  document.getElementById('totalJarak').textContent = formatJarak(ruteData.distance);

  // estimasi waktu (asumsi 30 km/jam rata-rata)
  const detik = sisa / (30000 / 3600);
  const menit = Math.round(detik / 60);
  document.getElementById('estimasi').textContent = menit < 60
    ? menit + ' mnt'
    : Math.floor(menit / 60) + ' j ' + (menit % 60) + ' m';
}
